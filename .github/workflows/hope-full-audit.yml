HOPE Marketplace 3.8.0+11 — FULL AUDIT V2

هدف: اجرای کامل تمام تست‌ها و تولید گزارش نهایی حتی در صورت وجود failure

فایل ورودی دقیق:

"HOPE-MARKETPLACE-3.8.0-V6-REPAIRED.zip"

اصل شماره 1 — هیچ تستی نباید به خاطر failure تست قبلی متوقف شود

تست‌ها را مستقل اجرا کن.

ممنوع:

- استفاده از "set -e" برای کل زنجیره تست‌ها
- متوقف کردن job بعد از اولین failure
- شرط‌گذاری که اجرای تست‌های بعدی را به PASS شدن تست قبلی وابسته کند

مجاز:

- "set -euo pipefail" فقط داخل یک case منفرد
- در wrapper هر case، exit code را بگیر و بعد اجرای case بعدی را ادامه بده

الگوی اجباری:

run_case() {
  NAME="$1"
  shift

  mkdir -p "audit/cases/$NAME"

  {
    echo "CASE=$NAME"
    echo "START=$(date -u +%FT%TZ)"
    echo "COMMAND=$*"
  } > "audit/cases/$NAME/metadata.txt"

  set +e
  "$@" > "audit/cases/$NAME/run.log" 2>&1
  RC=$?
  set -e

  printf '%s\n' "$RC" > "audit/cases/$NAME/status.txt"

  if [ "$RC" -eq 0 ]; then
    echo "PASS" > "audit/cases/$NAME/result.txt"
  else
    echo "FAIL" > "audit/cases/$NAME/result.txt"
  fi

  return 0
}

نکته حیاتی: "run_case" همیشه باید "0" برگرداند تا failure یک case باعث توقف shell نشود.

