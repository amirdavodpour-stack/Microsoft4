name: HOPE Full Audit
on: [push, workflow_dispatch]
permissions: {contents: read}

jobs:
audit:
runs-on: ubuntu-latest
timeout-minutes: 90

steps:
  - name: Checkout
    uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

  - name: Setup Java
    uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
    with: {distribution: temurin, java-version: "17"}

  - name: Setup Flutter
    uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
    with: {flutter-version: "3.47.1", channel: stable, cache: true}

  - name: Setup Node
    uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
    with: {node-version: "24"}

  - name: Run ALL tests and collect results
    continue-on-error: true
    shell: bash
    run: |
      set -u

      mkdir -p audit-results/cases

      run_case() {
        NAME="$1"
        shift

        DIR="audit-results/cases/$NAME"
        mkdir -p "$DIR"

        echo "CASE=$NAME" > "$DIR/metadata.txt"
        echo "COMMAND=$*" >> "$DIR/metadata.txt"

        set +e
        "$@" > "$DIR/run.log" 2>&1
        RC=$?
        set -e

        echo "$RC" > "$DIR/status.txt"

        if [ "$RC" -eq 0 ]; then
          echo "PASS" > "$DIR/result.txt"
        else
          echo "FAIL" > "$DIR/result.txt"
        fi

        return 0
      }

      block_case() {
        NAME="$1"
        REASON="$2"

        DIR="audit-results/cases/$NAME"
        mkdir -p "$DIR"

        echo "BLOCKED" > "$DIR/result.txt"
        echo "0" > "$DIR/status.txt"
        echo "$REASON" > "$DIR/run.log"
        echo "CASE=$NAME" > "$DIR/metadata.txt"
        echo "STATUS=BLOCKED" >> "$DIR/metadata.txt"
        echo "REASON=$REASON" >> "$DIR/metadata.txt"
      }

      echo "=== ENVIRONMENT ===" > audit-results/environment.txt
      date -u >> audit-results/environment.txt
      flutter --version >> audit-results/environment.txt 2>&1 || true
      dart --version >> audit-results/environment.txt 2>&1 || true
      java -version >> audit-results/environment.txt 2>&1 || true
      node --version >> audit-results/environment.txt 2>&1 || true
      npm --version >> audit-results/environment.txt 2>&1 || true

      ZIP=""

      for candidate in \
        "HOPE-MARKETPLACE-3.8.0-V6-REPAIRED.zip" \
        "HOPE-3_8_0-build-ready.zip" \
        "HOPE-marketplace-ready.zip"
      do
        if [ -f "$candidate" ]; then
          ZIP="$candidate"
          break
        fi
      done

      if [ -z "$ZIP" ]; then
        block_case source_zip "HOPE source ZIP not found in repository root"
      else
        run_case zip_integrity unzip -t "$ZIP"

        rm -rf audit-results/source
        mkdir -p audit-results/source

        set +e
        unzip -q "$ZIP" -d audit-results/source
        UNZIP_RC=$?
        set -e

        if [ "$UNZIP_RC" -ne 0 ]; then
          block_case source_extract "ZIP extraction failed"
        else

          ROOT="$(find audit-results/source -type f -name pubspec.yaml -print | head -n 1 | xargs -r dirname)"

          if [ -z "$ROOT" ]; then
            block_case project_root "pubspec.yaml not found"
          else

            echo "$ROOT" > audit-results/project-root.txt

            # Flutter
            run_case flutter_pub_get bash -c "cd '$ROOT' && flutter pub get"
            run_case flutter_gen_l10n bash -c "cd '$ROOT' && flutter gen-l10n"
            run_case flutter_format bash -c "cd '$ROOT' && dart format --set-exit-if-changed ."
            run_case flutter_analyze bash -c "cd '$ROOT' && flutter analyze"
            run_case flutter_test bash -c "cd '$ROOT' && flutter test --no-pub"

            if [ -d "$ROOT/integration_test" ]; then
              run_case flutter_integration_test bash -c "cd '$ROOT' && flutter test integration_test"
            else
              block_case flutter_integration_test "integration_test directory not present"
            fi

            # Localization / UX / Android contracts
            if [ -f "$ROOT/tools/check_localization.sh" ]; then
              run_case localization bash -c "cd '$ROOT' && bash tools/check_localization.sh"
            else
              block_case localization "checker not found"
            fi

            if [ -f "$ROOT/tools/check_localization_wave9.sh" ]; then
              run_case localization_wave9 bash -c "cd '$ROOT' && bash tools/check_localization_wave9.sh"
            else
              block_case localization_wave9 "checker not found"
            fi

            if [ -f "$ROOT/tools/check_ux_wave8.sh" ]; then
              run_case ux_wave8 bash -c "cd '$ROOT' && bash tools/check_ux_wave8.sh"
            else
              block_case ux_wave8 "checker not found"
            fi

            if [ -f "$ROOT/tools/android-release-contract.sh" ]; then
              run_case android_release_contract bash -c "cd '$ROOT' && bash tools/android-release-contract.sh"
            else
              block_case android_release_contract "checker not found"
            fi

            if [ -f "$ROOT/tools/android-runtime-cert-contract.sh" ]; then
              run_case android_runtime_contract bash -c "cd '$ROOT' && bash tools/android-runtime-cert-contract.sh"
            else
              block_case android_runtime_contract "checker not found"
            fi

            # Backend
            if [ -f "$ROOT/backend/package.json" ]; then
              run_case backend_npm_ci bash -c "cd '$ROOT/backend' && npm ci"
              run_case backend_check bash -c "cd '$ROOT/backend' && npm run check"
              run_case backend_test bash -c "cd '$ROOT/backend' && npm test"
              run_case backend_contract bash -c "cd '$ROOT/backend' && npm run test:contract"
              run_case backend_product bash -c "cd '$ROOT/backend' && npm run test:product"
              run_case backend_check_all bash -c "cd '$ROOT/backend' && npm run check:all"
              run_case backend_audit bash -c "cd '$ROOT/backend' && npm audit --audit-level=high"
            else
              block_case backend_npm_ci "backend/package.json missing"
              block_case backend_check "backend/package.json missing"
              block_case backend_test "backend/package.json missing"
              block_case backend_contract "backend/package.json missing"
              block_case backend_product "backend/package.json missing"
              block_case backend_check_all "backend/package.json missing"
              block_case backend_audit "backend/package.json missing"
            fi

            # Android build
            run_case android_build bash -c "cd '$ROOT' && flutter build apk --release"

            APK="$(find "$ROOT/build" -type f -name '*.apk' 2>/dev/null | head -n 1)"

            if [ -n "$APK" ] && [ -f "$APK" ]; then
              mkdir -p audit-results/android
              cp "$APK" audit-results/android/
              {
                echo "APK=$APK"
                echo "SIZE=$(stat -c%s "$APK" 2>/dev/null || stat -f%z "$APK")"
                echo "SHA256=$(sha256sum "$APK" 2>/dev/null | awk '{print $1}' || shasum -a 256 "$APK" | awk '{print $1}')"
              } > audit-results/android/apk-info.txt
              echo "PASS" > audit-results/cases/android_artifact/result.txt
              echo "0" > audit-results/cases/android_artifact/status.txt
              cp audit-results/android/apk-info.txt audit-results/cases/android_artifact/run.log
            else
              block_case android_artifact "No APK found after release build"
            fi
          fi
        fi
      fi

      TOTAL=0
      PASS=0
      FAIL=0
      SKIPPED=0
      BLOCKED=0

      : > audit-results/SUMMARY.txt

      for DIR in audit-results/cases/*; do
        [ -d "$DIR" ] || continue

        NAME="$(basename "$DIR")"
        RESULT="$(cat "$DIR/result.txt" 2>/dev/null || echo BLOCKED)"

        case "$RESULT" in
          PASS) PASS=$((PASS+1)) ;;
          FAIL) FAIL=$((FAIL+1)) ;;
          SKIPPED) SKIPPED=$((SKIPPED+1)) ;;
          BLOCKED) BLOCKED=$((BLOCKED+1)) ;;
          *) RESULT="BLOCKED"; BLOCKED=$((BLOCKED+1)) ;;
        esac

        TOTAL=$((TOTAL+1))
        printf "%-40s %s\n" "$NAME" "$RESULT" >> audit-results/SUMMARY.txt
      done

      if [ "$FAIL" -gt 0 ]; then
        OVERALL="FAIL"
      elif [ "$BLOCKED" -gt 0 ]; then
        OVERALL="BLOCKED"
      else
        OVERALL="PASS"
      fi

      {
        echo "# HOPE Marketplace 3.8.0+11 — Full Audit"
        echo
        echo "Overall: **$OVERALL**"
        echo
        echo "| Metric | Count |"
        echo "|---|---:|"
        echo "| Total | $TOTAL |"
        echo "| PASS | $PASS |"
        echo "| FAIL | $FAIL |"
        echo "| SKIPPED | $SKIPPED |"
        echo "| BLOCKED | $BLOCKED |"
        echo
        echo "## Test Matrix"
        echo
        echo '```text'
        cat audit-results/SUMMARY.txt
        echo '```'
        echo
        echo "## Failures"
        echo
      } > audit-results/FINAL-AUDIT-REPORT.md

      for DIR in audit-results/cases/*; do
        [ -d "$DIR" ] || continue
        RESULT="$(cat "$DIR/result.txt" 2>/dev/null || true)"

        if [ "$RESULT" = "FAIL" ]; then
          NAME="$(basename "$DIR")"
          {
            echo "### $NAME"
            echo
            echo "Exit code: $(cat "$DIR/status.txt" 2>/dev/null || echo unknown)"
            echo
            echo '```text'
            tail -n 100 "$DIR/run.log" 2>/dev/null || true
            echo '```'
            echo
          } >> audit-results/FINAL-AUDIT-REPORT.md
        fi
      done

      {
        echo "## Release Decision"
        echo
        echo "**$OVERALL**"
      } >> audit-results/FINAL-AUDIT-REPORT.md

      python3 <<'PY'
      import json
      from pathlib import Path

      root = Path("audit-results")

      counts = {
          "PASS": 0,
          "FAIL": 0,
          "SKIPPED": 0,
          "BLOCKED": 0
      }

      cases = []

      for result_file in sorted((root / "cases").glob("*/result.txt")):
          case_dir = result_file.parent
          name = case_dir.name
          status = result_file.read_text().strip()

          if status not in counts:
              status = "BLOCKED"

          counts[status] += 1

          exit_code = None
          sf = case_dir / "status.txt"

          if sf.exists():
              try:
                  exit_code = int(sf.read_text().strip())
              except Exception:
                  pass

          cases.append({
              "name": name,
              "status": status,
              "exit_code": exit_code
          })

      total = sum(counts.values())

      if counts["FAIL"] > 0:
          overall = "FAIL"
      elif counts["BLOCKED"] > 0:
          overall = "BLOCKED"
      else:
          overall = "PASS"

      report = {
          "project": "HOPE Marketplace",
          "version": "3.8.0+11",
          "overall": overall,
          "tests_total": total,
          "tests_passed": counts["PASS"],
          "tests_failed": counts["FAIL"],
          "tests_skipped": counts["SKIPPED"],
          "tests_blocked": counts["BLOCKED"],
          "cases": cases
      }

      (root / "FINAL-AUDIT-REPORT.json").write_text(
          json.dumps(report, indent=2),
          encoding="utf-8"
      )

      (root / "final-status.env").write_text(
          "\n".join([
              f"TOTAL={total}",
              f"PASS={counts['PASS']}",
              f"FAIL={counts['FAIL']}",
              f"SKIPPED={counts['SKIPPED']}",
              f"BLOCKED={counts['BLOCKED']}",
              f"OVERALL={overall}",
          ]) + "\n",
          encoding="utf-8"
      )
      PY

      echo
      echo "========================================"
      echo "HOPE MARKETPLACE 3.8.0+11"
      echo "FULL AUDIT RESULT"
      echo "========================================"
      cat audit-results/FINAL-AUDIT-REPORT.md
      echo
      echo "========================================"

  - name: Upload complete audit results
    if: always()
    uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
    with:
      name: HOPE-FULL-AUDIT-${{ github.run_id }}
      path: audit-results
      if-no-files-found: warn
      retention-days: 14

  - name: Final gate
    if: always()
    shell: bash
    run: |
      set +e

      FILE="audit-results/final-status.env"

      if [ ! -f "$FILE" ]; then
        echo "No final status was generated."
        exit 1
      fi

      . "$FILE"

      echo
      echo "========================================"
      echo "FINAL GATE"
      echo "TOTAL:   $TOTAL"
      echo "PASS:    $PASS"
      echo "FAIL:    $FAIL"
      echo "SKIPPED: $SKIPPED"
      echo "BLOCKED: $BLOCKED"
      echo "RESULT:  $OVERALL"
      echo "========================================"

      if [ "$OVERALL" = "PASS" ]; then
        exit 0
      fi

      exit 1
