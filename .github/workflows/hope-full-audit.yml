name: HOPE Full Audit

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.1"
  JAVA_VERSION: "17"
  NODE_VERSION: "24"
  AUDIT_TIMEOUT_MINUTES: "20"

jobs:
  audit:
    name: HOPE Complete Audit
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize audit
        shell: bash
        run: |
          set +e

          rm -rf audit-results source
          mkdir -p audit-results
          mkdir -p source

          {
            echo "HOPE Marketplace — Complete Audit"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Flutter: $FLUTTER_VERSION"
            echo "Java: $JAVA_VERSION"
            echo "Node: $NODE_VERSION"
          } > audit-results/SUMMARY.txt

      - name: Locate and extract HOPE source
        shell: bash
        run: |
          set +e

          ZIP=""

          CANDIDATES=(
            "HOPE-MARKETPLACE-3.8.0-V6-REPAIRED.zip"
            "HOPE-3_8_0-build-ready.zip"
            "HOPE-marketplace-test-apk-ready-v5-1.zip"
          )

          for candidate in "${CANDIDATES[@]}"; do
            if [ -f "$candidate" ]; then
              ZIP="$candidate"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            ZIP="$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1)"
          fi

          if [ -z "$ZIP" ]; then
            echo "BLOCKED" > audit-results/source.status
            echo "No HOPE source ZIP found." > audit-results/source.log
            exit 0
          fi

          echo "SOURCE_ZIP=$ZIP" > audit-results/source.log

          if ! unzip -t "$ZIP" > audit-results/zip-integrity.log 2>&1; then
            echo "FAIL" > audit-results/source.status
            echo "ZIP integrity check failed." >> audit-results/source.log
            exit 0
          fi

          unzip -q "$ZIP" -d source

          echo "PASS" > audit-results/source.status

          FLUTTER_ROOT=""

          FLUTTER_ROOT="$(find source -type f -name pubspec.yaml -print -quit | xargs -r dirname)"

          if [ -z "$FLUTTER_ROOT" ]; then
            FLUTTER_ROOT="$(find source -type d -name hope_mobile -print -quit)"
          fi

          if [ -z "$FLUTTER_ROOT" ]; then
            echo "BLOCKED" > audit-results/flutter-root.status
            echo "Flutter project root could not be detected." > audit-results/flutter-root.log
          else
            FLUTTER_ROOT="$(cd "$FLUTTER_ROOT" && pwd)"
            echo "$FLUTTER_ROOT" > audit-results/FLUTTER_ROOT.txt
            echo "PASS" > audit-results/flutter-root.status
          fi

          BACKEND_ROOT=""

          if [ -n "$FLUTTER_ROOT" ] && [ -d "$FLUTTER_ROOT/backend" ]; then
            BACKEND_ROOT="$FLUTTER_ROOT/backend"
          fi

          if [ -z "$BACKEND_ROOT" ]; then
            BACKEND_ROOT="$(find source -type f -name package.json -print -quit | xargs -r dirname)"
          fi

          if [ -n "$BACKEND_ROOT" ] && [ -f "$BACKEND_ROOT/package.json" ]; then
            BACKEND_ROOT="$(cd "$BACKEND_ROOT" && pwd)"
            echo "$BACKEND_ROOT" > audit-results/BACKEND_ROOT.txt
            echo "PASS" > audit-results/backend-root.status
          else
            echo "BLOCKED" > audit-results/backend-root.status
            echo "Backend package.json could not be detected." > audit-results/backend-root.log
          fi

          {
            echo
            echo "FLUTTER_ROOT=${FLUTTER_ROOT:-NOT_FOUND}"
            echo "BACKEND_ROOT=${BACKEND_ROOT:-NOT_FOUND}"
          } >> audit-results/SUMMARY.txt

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Capture toolchain
        shell: bash
        run: |
          set +e

          flutter --version > audit-results/flutter-version.log 2>&1
          flutter doctor -v > audit-results/flutter-doctor.log 2>&1
          java -version > audit-results/java-version.log 2>&1
          node --version > audit-results/node-version.log 2>&1
          npm --version > audit-results/npm-version.log 2>&1

      - name: Audit project structure
        shell: bash
        run: |
          set +e

          ROOT="$(cat audit-results/FLUTTER_ROOT.txt 2>/dev/null)"

          if [ -z "$ROOT" ]; then
            echo "BLOCKED" > audit-results/project-structure.status
            exit 0
          fi

          {
            echo "=== TOP LEVEL ==="
            find "$ROOT" -maxdepth 2 -type f | sort | head -n 1000

            echo
            echo "=== PUBSPEC ==="
            sed -n '1,240p' "$ROOT/pubspec.yaml"

            echo
            echo "=== PROJECT VERSION ==="
            grep -nE '^(name|version):' "$ROOT/pubspec.yaml" 2>/dev/null

            echo
            echo "=== LOCK FILE ==="
            if [ -f "$ROOT/pubspec.lock" ]; then
              echo "pubspec.lock PRESENT"
            else
              echo "pubspec.lock MISSING"
            fi
          } > audit-results/project-structure.log 2>&1

          echo "PASS" > audit-results/project-structure.status

      - name: Flutter dependency audit
        shell: bash
        run: |
          set +e

          ROOT="$(cat audit-results/FLUTTER_ROOT.txt 2>/dev/null)"

          if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
            echo "BLOCKED" > audit-results/flutter-dependencies.status
            exit 0
          fi

          cd "$ROOT"

          LOCK_BEFORE="MISSING"

          if [ -f pubspec.lock ]; then
            LOCK_BEFORE="PRESENT"
            sha256sum pubspec.lock > "$GITHUB_WORKSPACE/audit-results/pubspec-lock-before.sha256"
          fi

          {
            echo "LOCK_BEFORE=$LOCK_BEFORE"
            echo
            echo "=== PUB GET ==="

            flutter pub get
            PUB_RC=$?

            echo
            echo "PUB_GET_EXIT_CODE=$PUB_RC"

            echo
            echo "=== GEN L10N ==="

            flutter gen-l10n
            L10N_RC=$?

            echo
            echo "GEN_L10N_EXIT_CODE=$L10N_RC"

            echo
            echo "=== LOCK AFTER ==="

            if [ -f pubspec.lock ]; then
              echo "pubspec.lock PRESENT AFTER pub get"
              sha256sum pubspec.lock
            else
              echo "pubspec.lock STILL MISSING"
            fi

          } > "$GITHUB_WORKSPACE/audit-results/flutter-dependencies.log" 2>&1

          if [ "$PUB_RC" -eq 0 ] && [ "$L10N_RC" -eq 0 ]; then
            echo "PASS" > "$GITHUB_WORKSPACE/audit-results/flutter-dependencies.status"
          else
            echo "FAIL" > "$GITHUB_WORKSPACE/audit-results/flutter-dependencies.status"
          fi

          if [ "$LOCK_BEFORE" = "MISSING" ]; then
            echo "BLOCKED" > "$GITHUB_WORKSPACE/audit-results/pubspec-lock.status"
          else
            echo "PASS" > "$GITHUB_WORKSPACE/audit-results/pubspec-lock.status"
          fi

          exit 0

      - name: Flutter format audit
        shell: bash
        run: |
          set +e

          ROOT="$(cat audit-results/FLUTTER_ROOT.txt 2>/dev/null)"

          if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
            echo "BLOCKED" > audit-results/flutter-format.status
            exit 0
          fi

          cd "$ROOT"

          dart format --output=none --set-exit-if-changed . \
            > "$GITHUB_WORKSPACE/audit-results/flutter-format.log" 2>&1

          RC=$?

          echo "EXIT_CODE=$RC" \
            >> "$GITHUB_WORKSPACE/audit-results/flutter-format.log"

          if [ "$RC" -eq 0 ]; then
            echo "PASS" > "$GITHUB_WORKSPACE/audit-results/flutter-format.status"
          else
            echo "FAIL" > "$GITHUB_WORKSPACE/audit-results/flutter-format.status"
          fi

          exit 0

      - name: Flutter analyze
        shell: bash
        run: |
          set +e

          ROOT="$(cat audit-results/FLUTTER_ROOT.txt 2>/dev/null)"

          if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
            echo "BLOCKED" > audit-results/flutter-analyze.status
            exit 0
          fi

          cd "$ROOT"

          flutter analyze \
            > "$GITHUB_WORKSPACE/audit-results/flutter-analyze.log" 2>&1

          RC=$?

          echo "EXIT_CODE=$RC" \
            >> "$GITHUB_WORKSPACE/audit-results/flutter-analyze.log"

          if [ "$RC" -eq 0 ]; then
            echo "PASS" > "$GITHUB_WORKSPACE/audit-results/flutter-analyze.status"
          else
            echo "FAIL" > "$GITHUB_WORKSPACE/audit-results/flutter-analyze.status"
          fi

          exit 0

      - name: Flutter tests
        shell: bash
        run: |
          set +e

          ROOT="$(cat audit-results/FLUTTER_ROOT.txt 2>/dev/null)"

          if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
            echo "BLOCKED" > audit-results/flutter-tests.status
            exit 0
          fi

          cd "$ROOT"

          flutter test --no-pub \
            > "$GITHUB_WORKSPACE/audit-results/flutter-tests.log" 2>&1

          RC=$?

          echo "EXIT_CODE=$RC" \
            >> "$GITHUB_WORKSPACE/audit-results/flutter-tests.log"

          if [ "$RC" -eq 0 ]; then
            echo "PASS" > "$GITHUB_WORKSPACE/audit-results/flutter-tests.status"
          else
            echo "FAIL" > "$GITHUB_WORKSPACE/audit-results/flutter-tests.status"
          fi

          exit 0

      - name: Discover backend scripts
        shell: bash
        run: |
          set +e

          BACKEND="$(cat audit-results/BACKEND_ROOT.txt 2>/dev/null)"

          if [ -z "$BACKEND" ] || [ ! -f "$BACKEND/package.json" ]; then
            echo "BLOCKED" > audit-results/backend-discovery.status
            exit 0
          fi

          cd "$BACKEND"

          node <<'NODE' > "$GITHUB_WORKSPACE/audit-results/backend-scripts.json"
          const fs = require("fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const scripts = pkg.scripts || {};

          console.log(JSON.stringify({
            packageName: pkg.name || null,
            version: pkg.version || null,
            scripts
          }, null, 2));
          NODE

          {
            echo "=== package.json ==="
            cat package.json

            echo
            echo "=== SCRIPT NAMES ==="
            npm run
          } > "$GITHUB_WORKSPACE/audit-results/backend-discovery.log" 2>&1

          echo "PASS" > "$GITHUB_WORKSPACE/audit-results/backend-discovery.status"

      - name: Install backend dependencies
        shell: bash
        run: |
          set +e

          BACKEND="$(cat audit-results/BACKEND_ROOT.txt 2>/dev/null)"

          if [ -z "$BACKEND" ] || [ ! -d "$BACKEND" ]; then
            echo "BLOCKED" > audit-results/backend-install.status
            exit 0
          fi

          cd "$BACKEND"

          if [ -f package-lock.json ]; then
            npm ci \
              > "$GITHUB_WORKSPACE/audit-results/backend-install.log" 2>&1
          else
            npm install \
              > "$GITHUB_WORKSPACE/audit-results/backend-install.log" 2>&1
          fi

          RC=$?

          echo "EXIT_CODE=$RC" \
            >> "$GITHUB_WORKSPACE/audit-results/backend-install.log"

          if [ "$RC" -eq 0 ]; then
            echo "PASS" > "$GITHUB_WORKSPACE/audit-results/backend-install.status"
          else
            echo "FAIL" > "$GITHUB_WORKSPACE/audit-results/backend-install.status"
          fi

          exit 0

      - name: Run backend test and verification scripts
        shell: bash
        run: |
          set +e

          BACKEND="$(cat audit-results/BACKEND_ROOT.txt 2>/dev/null)"

          if [ -z "$BACKEND" ] || [ ! -d "$BACKEND" ]; then
            echo "BLOCKED" > audit-results/backend-tests.status
            exit 0
          fi

          cd "$BACKEND"

          FAILURES=0
          CASES=0
          BLOCKED=0

          SCRIPT_LOG_DIR="$GITHUB_WORKSPACE/audit-results/backend-cases"
          mkdir -p "$SCRIPT_LOG_DIR"

          run_script() {
            SCRIPT="$1"

            CASES=$((CASES + 1))

            SAFE_NAME="$(echo "$SCRIPT" | tr ':/' '__')"
            LOG="$SCRIPT_LOG_DIR/$SAFE_NAME.log"

            echo
            echo "========================================"
            echo "BACKEND SCRIPT: $SCRIPT"
            echo "========================================"

            timeout "${AUDIT_TIMEOUT_MINUTES}m" npm run "$SCRIPT" \
              > "$LOG" 2>&1

            RC=$?

            {
              echo
              echo "EXIT_CODE=$RC"
            } >> "$LOG"

            echo "RESULT=$RC" >> "$SCRIPT_LOG_DIR/$SAFE_NAME.status"

            if [ "$RC" -ne 0 ]; then
              FAILURES=$((FAILURES + 1))
            fi

            return 0
          }

          if [ ! -f package.json ]; then
            echo "BLOCKED" > "$GITHUB_WORKSPACE/audit-results/backend-tests.status"
            exit 0
          fi

          mapfile -t SCRIPTS < <(
            node -e '
              const p=require("./package.json");
              for (const k of Object.keys(p.scripts||{}).sort()) console.log(k);
            '
          )

          for SCRIPT in "${SCRIPTS[@]}"; do

            case "$SCRIPT" in
              test|test:*|check|check:*|verify|verify:*|lint|lint:*|audit|audit:*|contract|contract:*|product|product:*|security|security:*|resilience|resilience:*|backup|backup:*|restore|restore:*|staging|staging:*|postgres|postgres:*|provider|provider:*|failure|failure:*|integration|integration:*|e2e|e2e:*)
                run_script "$SCRIPT"
                ;;
            esac

          done

          {
            echo "TOTAL_CASES=$CASES"
            echo "TOTAL_FAILURES=$FAILURES"
            echo "TOTAL_BLOCKED=$BLOCKED"
          } > "$GITHUB_WORKSPACE/audit-results/backend-tests-summary.txt"

          if [ "$CASES" -eq 0 ]; then
            echo "BLOCKED" > "$GITHUB_WORKSPACE/audit-results/backend-tests.status"
          elif [ "$FAILURES" -eq 0 ]; then
            echo "PASS" > "$GITHUB_WORKSPACE/audit-results/backend-tests.status"
          else
            echo "FAIL" > "$GITHUB_WORKSPACE/audit-results/backend-tests.status"
          fi

          exit 0

      - name: Backend npm audit
        shell: bash
        run: |
          set +e

          BACKEND="$(cat audit-results/BACKEND_ROOT.txt 2>/dev/null)"

          if [ -z "$BACKEND" ] || [ ! -d "$BACKEND" ]; then
            echo "BLOCKED" > audit-results/backend-security.status
            exit 0
          fi

          cd "$BACKEND"

          npm audit --audit-level=high \
            > "$GITHUB_WORKSPACE/audit-results/backend-npm-audit.log" 2>&1

          RC=$?

          echo "EXIT_CODE=$RC" \
            >> "$GITHUB_WORKSPACE/audit-results/backend-npm-audit.log"

          if [ "$RC" -eq 0 ]; then
            echo "PASS" > "$GITHUB_WORKSPACE/audit-results/backend-security.status"
          else
            echo "FAIL" > "$GITHUB_WORKSPACE/audit-results/backend-security.status"
          fi

          exit 0

      - name: Android configuration audit
        shell: bash
        run: |
          set +e

          ROOT="$(cat audit-results/FLUTTER_ROOT.txt 2>/dev/null)"

          if [ -z "$ROOT" ] || [ ! -d "$ROOT/android" ]; then
            echo "BLOCKED" > audit-results/android-config.status
            exit 0
          fi

          {
            echo "=== GRADLE FILES ==="

            find "$ROOT/android" \
              -type f \
              \( \
                -name '*.gradle' \
                -o -name '*.gradle.kts' \
                -o -name 'gradle.properties' \
                -o -name 'AndroidManifest.xml' \
              \) \
              -print \
              | sort

            echo
            echo "=== ANDROID VALUES ==="

            grep -RInE \
              'compileSdk|targetSdk|minSdk|namespace|applicationId|ndkVersion|sourceCompatibility|targetCompatibility|jvmTarget' \
              "$ROOT/android" 2>/dev/null \
              | head -n 1000

            echo
            echo "=== SIGNING REFERENCES ==="

            grep -RInE \
              'signingConfigs|storeFile|storePassword|keyAlias|keyPassword|ANDROID_RELEASE|release.*sign' \
              "$ROOT/android" 2>/dev/null \
              | head -n 1000

          } > audit-results/android-config.log 2>&1

          echo "PASS" > audit-results/android-config.status

      - name: Android release build
        shell: bash
        run: |
          set +e

          ROOT="$(cat audit-results/FLUTTER_ROOT.txt 2>/dev/null)"

          if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
            echo "BLOCKED" > audit-results/android-release.status
            exit 0
          fi

          cd "$ROOT"

          flutter build apk --release --no-pub \
            > "$GITHUB_WORKSPACE/audit-results/android-release.log" 2>&1

          RC=$?

          echo "EXIT_CODE=$RC" \
            >> "$GITHUB_WORKSPACE/audit-results/android-release.log"

          if [ "$RC" -eq 0 ]; then

            echo "PASS" > "$GITHUB_WORKSPACE/audit-results/android-release.status"

            find "$ROOT/build" \
              -type f \
              -name '*.apk' \
              -exec ls -lh {} \; \
              > "$GITHUB_WORKSPACE/audit-results/apk-files.txt" 2>&1

            find "$ROOT/build" \
              -type f \
              -name '*.apk' \
              -exec sha256sum {} \; \
              > "$GITHUB_WORKSPACE/audit-results/apk-sha256.txt" 2>&1

          else

            if grep -Eqi \
              'signing|keystore|storeFile|storePassword|keyPassword|ANDROID_RELEASE_STORE_FILE|release signing' \
              "$GITHUB_WORKSPACE/audit-results/android-release.log"; then

              echo "BLOCKED" > "$GITHUB_WORKSPACE/audit-results/android-release.status"

            else

              echo "FAIL" > "$GITHUB_WORKSPACE/audit-results/android-release.status"

            fi

          fi

          exit 0

      - name: Android debug build fallback
        shell: bash
        run: |
          set +e

          ROOT="$(cat audit-results/FLUTTER_ROOT.txt 2>/dev/null)"

          if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
            echo "BLOCKED" > audit-results/android-debug.status
            exit 0
          fi

          cd "$ROOT"

          flutter build apk --debug --no-pub \
            > "$GITHUB_WORKSPACE/audit-results/android-debug.log" 2>&1

          RC=$?

          echo "EXIT_CODE=$RC" \
            >> "$GITHUB_WORKSPACE/audit-results/android-debug.log"

          if [ "$RC" -eq 0 ]; then
            echo "PASS" > "$GITHUB_WORKSPACE/audit-results/android-debug.status"

            find "$ROOT/build" \
              -type f \
              -name '*debug*.apk' \
              -exec sha256sum {} \; \
              > "$GITHUB_WORKSPACE/audit-results/android-debug-sha256.txt" 2>&1

          else
            echo "FAIL" > "$GITHUB_WORKSPACE/audit-results/android-debug.status"
          fi

          exit 0

      - name: CI workflow audit
        shell: bash
        run: |
          set +e

          ROOT="$(cat audit-results/FLUTTER_ROOT.txt 2>/dev/null)"

          {
            echo "=== WORKFLOWS ==="

            find "$ROOT/.github/workflows" \
              -type f \
              -maxdepth 2 \
              -print 2>/dev/null \
              | sort

            echo
            echo "=== ACTIONS ==="

            grep -RIn 'uses:' \
              "$ROOT/.github/workflows" 2>/dev/null

            echo
            echo "=== FLUTTER VERSIONS ==="

            grep -RInE \
              'flutter-version|FLUTTER_VERSION' \
              "$ROOT/.github/workflows" 2>/dev/null

            echo
            echo "=== JAVA VERSIONS ==="

            grep -RInE \
              'java-version|JAVA_VERSION' \
              "$ROOT/.github/workflows" 2>/dev/null

            echo
            echo "=== API / RELEASE SECRETS ==="

            grep -RInE \
              'secrets\.|API_BASE_URL|ANDROID_RELEASE|KEYSTORE' \
              "$ROOT/.github/workflows" 2>/dev/null

          } > audit-results/ci-workflow-audit.log 2>&1

          echo "PASS" > audit-results/ci-workflow-audit.status

      - name: Security static scan
        shell: bash
        run: |
          set +e

          ROOT="$(cat audit-results/FLUTTER_ROOT.txt 2>/dev/null)"

          {
            echo "=== PRIVATE KEY PATTERNS ==="

            grep -RInE \
              --exclude-dir=.git \
              --exclude='*.lock' \
              --exclude='*.sum' \
              'BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) PRIVATE KEY' \
              "$ROOT" 2>/dev/null \
              | head -n 300

            echo
            echo "=== POSSIBLE CREDENTIAL VARIABLES ==="

            grep -RInE \
              --exclude-dir=.git \
              --exclude='*.lock' \
              --exclude='*.sum' \
              '(api[_-]?key|secret[_-]?key|client[_-]?secret|password|token|access[_-]?token)' \
              "$ROOT" 2>/dev/null \
              | head -n 500

            echo
            echo "=== GITIGNORE ==="

            if [ -f "$ROOT/.gitignore" ]; then
              cat "$ROOT/.gitignore"
            fi

          } > audit-results/security-static.log 2>&1

          echo "REVIEW_REQUIRED" > audit-results/security-static.status

      - name: Runtime environment audit
        shell: bash
        run: |
          set +e

          ROOT="$(cat audit-results/FLUTTER_ROOT.txt 2>/dev/null)"

          {
            echo "=== DOCKER ==="

            if command -v docker >/dev/null 2>&1; then
              docker --version
              echo "DOCKER_AVAILABLE=true"
            else
              echo "DOCKER_AVAILABLE=false"
            fi

            echo
            echo "=== ADB ==="

            if command -v adb >/dev/null 2>&1; then
              adb version
              adb devices
              echo "ADB_AVAILABLE=true"
            else
              echo "ADB_AVAILABLE=false"
            fi

            echo
            echo "=== CONTAINERS / COMPOSE ==="

            find "$ROOT" \
              -type f \
              \( \
                -name 'Dockerfile' \
                -o -name 'Dockerfile.*' \
                -o -name 'docker-compose*.yml' \
                -o -name 'compose*.yml' \
              \) \
              -print 2>/dev/null \
              | sort

          } > audit-results/runtime.log 2>&1

          echo "PASS" > audit-results/runtime.status

      - name: Repository reproducibility audit
        shell: bash
        run: |
          set +e

          ROOT="$(cat audit-results/FLUTTER_ROOT.txt 2>/dev/null)"

          {
            echo "=== LOCK FILES ==="

            find "$ROOT" \
              -type f \
              \( \
                -name 'pubspec.lock' \
                -o -name 'package-lock.json' \
                -o -name 'yarn.lock' \
                -o -name 'pnpm-lock.yaml' \
              \) \
              -print \
              | sort

            echo
            echo "=== SOURCE ZIP HASH ==="

            cat audit-results/source.log 2>/dev/null

          } > audit-results/reproducibility.log 2>&1

          if [ -f audit-results/pubspec-lock.status ]; then
            LOCK_RESULT="$(cat audit-results/pubspec-lock.status)"
          else
            LOCK_RESULT="BLOCKED"
          fi

          if [ "$LOCK_RESULT" = "PASS" ]; then
            echo "PASS" > audit-results/reproducibility.status
          else
            echo "BLOCKED" > audit-results/reproducibility.status
          fi

      - name: Build audit report
        if: always()
        shell: bash
        run: |
          set +e

          REPORT="audit-results/FINAL-AUDIT-REPORT.md"

          get_status() {
            FILE="audit-results/$1.status"

            if [ -f "$FILE" ]; then
              cat "$FILE"
            else
              echo "NOT_RUN"
            fi
          }

          {
            echo "# HOPE Marketplace — Complete Audit Report"
            echo
            echo "## Execution"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Commit: $GITHUB_SHA"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Date UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Flutter: $FLUTTER_VERSION"
            echo "- Java: $JAVA_VERSION"
            echo "- Node: $NODE_VERSION"
            echo

            echo "## Source"
            echo
            cat audit-results/source.log 2>/dev/null || true
            echo

            echo "## Project Roots"
            echo
            echo "Flutter: $(cat audit-results/FLUTTER_ROOT.txt 2>/dev/null || echo NOT_FOUND)"
            echo "Backend: $(cat audit-results/BACKEND_ROOT.txt 2>/dev/null || echo NOT_FOUND)"
            echo

            echo "## Result Matrix"
            echo
            echo "| Audit Area | Status |"
            echo "|---|---|"
            echo "| Source ZIP | $(get_status source) |"
            echo "| Flutter root | $(get_status flutter-root) |"
            echo "| Backend root | $(get_status backend-root) |"
            echo "| Project structure | $(get_status project-structure) |"
            echo "| pubspec.lock reproducibility | $(get_status pubspec-lock) |"
            echo "| Flutter dependencies | $(get_status flutter-dependencies) |"
            echo "| Flutter format | $(get_status flutter-format) |"
            echo "| Flutter analyze | $(get_status flutter-analyze) |"
            echo "| Flutter tests | $(get_status flutter-tests) |"
            echo "| Backend discovery | $(get_status backend-discovery) |"
            echo "| Backend install | $(get_status backend-install) |"
            echo "| Backend tests/checks | $(get_status backend-tests) |"
            echo "| Backend npm audit | $(get_status backend-security) |"
            echo "| Android configuration | $(get_status android-config) |"
            echo "| Android release | $(get_status android-release) |"
            echo "| Android debug fallback | $(get_status android-debug) |"
            echo "| CI/workflow audit | $(get_status ci-workflow-audit) |"
            echo "| Security static scan | $(get_status security-static) |"
            echo "| Runtime environment | $(get_status runtime) |"
            echo "| Reproducibility | $(get_status reproducibility) |"
            echo

            echo "## Backend Summary"
            echo
            cat audit-results/backend-tests-summary.txt 2>/dev/null || echo "No backend summary."
            echo

            echo "## Android Summary"
            echo
            if [ -f audit-results/apk-files.txt ]; then
              cat audit-results/apk-files.txt
            fi

            if [ -f audit-results/apk-sha256.txt ]; then
              echo
              cat audit-results/apk-sha256.txt
            fi

            echo
            echo "## Critical Findings"
            echo

            if grep -RInE \
              'already declared|duplicate declaration|Error:|Unhandled exception|BUILD FAILED|Compilation failed' \
              audit-results 2>/dev/null \
              | head -n 200; then
              true
            else
              echo "No matching high-signal failure patterns found in collected logs."
            fi

            echo
            echo "## Evidence Files"
            echo

            find audit-results \
              -type f \
              -printf '%P\n' \
              | sort

            echo
            echo "## Status Definitions"
            echo
            echo "- PASS = test/check actually executed successfully."
            echo "- FAIL = test/check executed and failed."
            echo "- BLOCKED = required prerequisite, secret, service, or reproducibility input was unavailable."
            echo "- REVIEW_REQUIRED = manual review required."
            echo "- NOT_RUN = no result was produced."

          } > "$REPORT"

          cp "$REPORT" audit-results/FINAL-AUDIT-REPORT.txt

          {
            echo "{"
            echo "  \"repository\": \"$GITHUB_REPOSITORY\","
            echo "  \"commit\": \"$GITHUB_SHA\","
            echo "  \"run_id\": \"$GITHUB_RUN_ID\","
            echo "  \"flutter\": \"$FLUTTER_VERSION\","
            echo "  \"java\": \"$JAVA_VERSION\","
            echo "  \"node\": \"$NODE_VERSION\","
            echo "  \"generated_utc\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\""
            echo "}"
          } > audit-results/FINAL-AUDIT-REPORT.json

          cat "$REPORT"

      - name: Upload complete audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-COMPLETE-AUDIT-${{ github.run_number }}
          path: audit-results
          if-no-files-found: warn
          retention-days: 30

      - name: Final audit gate
        if: always()
        shell: bash
        run: |
          set +e

          HARD_FAIL=0
          CRITICAL_BLOCKED=0

          FAIL_CASES=(
            "flutter-dependencies"
            "flutter-format"
            "flutter-analyze"
            "flutter-tests"
            "backend-install"
            "backend-tests"
            "backend-security"
            "android-config"
            "android-debug"
          )

          for CASE in "${FAIL_CASES[@]}"; do

            if [ -f "audit-results/$CASE.status" ]; then
              RESULT="$(cat "audit-results/$CASE.status")"

              if [ "$RESULT" = "FAIL" ]; then
                HARD_FAIL=1
              fi
            fi

          done

          if [ -f audit-results/android-release.status ]; then
            ANDROID_RELEASE_RESULT="$(cat audit-results/android-release.status)"

            if [ "$ANDROID_RELEASE_RESULT" = "FAIL" ]; then
              HARD_FAIL=1
            elif [ "$ANDROID_RELEASE_RESULT" = "BLOCKED" ]; then
              CRITICAL_BLOCKED=1
            fi
          fi

          if [ -f audit-results/pubspec-lock.status ]; then
            if [ "$(cat audit-results/pubspec-lock.status)" = "BLOCKED" ]; then
              CRITICAL_BLOCKED=1
            fi
          fi

          echo
          echo "=============================================="
          echo "HOPE COMPLETE AUDIT — FINAL GATE"
          echo "=============================================="
          echo
          echo "HARD_FAIL=$HARD_FAIL"
          echo "CRITICAL_BLOCKED=$CRITICAL_BLOCKED"
          echo

          if [ "$HARD_FAIL" -ne 0 ]; then
            echo "AUDIT RESULT: FAIL"
            exit 1
          fi

          if [ "$CRITICAL_BLOCKED" -ne 0 ]; then
            echo "AUDIT RESULT: BLOCKED / INCOMPLETE"
            exit 1
          fi

          echo "AUDIT RESULT: PASS"
          exit 0
