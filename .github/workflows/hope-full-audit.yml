مرحله 10 — نتیجه نهایی

حتی اگر 1 یا 20 تست fail شده باشد، قبل از خروج هرگز متوقف نشو.

در پایان حتماً این دو فایل تولید شوند:

FINAL-AUDIT-REPORT.md
FINAL-AUDIT-REPORT.json

JSON باید دقیقاً شامل این ساختار باشد:

{
  "project": "HOPE Marketplace",
  "version": "3.8.0+11",
  "overall": "PASS|FAIL|BLOCKED",
  "tests_total": 0,
  "tests_passed": 0,
  "tests_failed": 0,
  "tests_skipped": 0,
  "tests_blocked": 0,
  "failures": [],
  "blocked_checks": [],
  "environment": {},
  "flutter": {},
  "backend": {},
  "android": {},
  "security": {},
  "release": {},
  "recommendations": []
}

قانون مهم برای overall

"PASS" فقط زمانی مجاز است که هیچ failure واقعی وجود نداشته باشد.

"FAIL" زمانی که تست واقعاً اجرا شده و fail شده است.

"BLOCKED" زمانی که prerequisite/environment اجازه اجرای واقعی تست را نداده است.

BLOCKED را هرگز به جای PASS حساب نکن.

