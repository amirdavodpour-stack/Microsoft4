name: HOPE Full Audit

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: "Source ZIP filename or relative path inside the repository"
        required: true
        type: string
        default: "HOPE-3_8_0-build-ready.zip"

      run_staging:
        description: "Run Flutter/Android staging build and test audit"
        required: false
        type: boolean
        default: true

      run_security:
        description: "Run security and dependency audit"
        required: false
        type: boolean
        default: true

      run_tests:
        description: "Run automated tests"
        required: false
        type: boolean
        default: true

      build_release:
        description: "Run release APK build"
        required: false
        type: boolean
        default: false

      flutter_channel:
        description: "Flutter channel"
        required: false
        type: string
        default: "stable"

permissions:
  contents: read

concurrency:
  group: hope-full-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_CHANNEL: ${{ inputs.flutter_channel }}
  JAVA_VERSION: "17"
  ANDROID_API: "36"
  NDK_VERSION: "28.2.13676358"
  PROJECT_DIR: "${{ github.workspace }}/hope_source"
  AUDIT_DIR: "${{ github.workspace }}/audit"

jobs:
  audit:
    name: HOPE Full Audit
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. Basic environment information
      # ------------------------------------------------------------
      - name: Print environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=== GitHub Environment ==="
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Ref: ${GITHUB_REF}"
          echo "SHA: ${GITHUB_SHA}"
          echo "Runner: ${RUNNER_OS}"
          echo

          echo "=== Java ==="
          java -version || true
          echo

          echo "=== Gradle / Android environment ==="
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo

      # ------------------------------------------------------------
      # 3. Locate source ZIP
      # ------------------------------------------------------------
      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="${{ inputs.source_zip }}"

          echo "Requested source ZIP: ${SOURCE_ZIP}"

          if [[ -f "${GITHUB_WORKSPACE}/${SOURCE_ZIP}" ]]; then
            echo "SOURCE_ZIP_PATH=${GITHUB_WORKSPACE}/${SOURCE_ZIP}" >> "${GITHUB_ENV}"
            echo "Found: ${GITHUB_WORKSPACE}/${SOURCE_ZIP}"
            exit 0
          fi

          if [[ -f "${SOURCE_ZIP}" ]]; then
            echo "SOURCE_ZIP_PATH=${SOURCE_ZIP}" >> "${GITHUB_ENV}"
            echo "Found: ${SOURCE_ZIP}"
            exit 0
          fi

          echo
          echo "ERROR: Source ZIP not found."
          echo
          echo "ZIP files available in repository:"
          find "${GITHUB_WORKSPACE}" -maxdepth 3 -type f \
            \( -iname "*.zip" -o -iname "*.ZIP" \) \
            -print | sort || true
          exit 1

      # ------------------------------------------------------------
      # 4. Prepare audit directories
      # ------------------------------------------------------------
      - name: Prepare audit directories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${PROJECT_DIR}"
          rm -rf "${AUDIT_DIR}"

          mkdir -p "${PROJECT_DIR}"
          mkdir -p "${AUDIT_DIR}"
          mkdir -p "${AUDIT_DIR}/reports"
          mkdir -p "${AUDIT_DIR}/logs"

      # ------------------------------------------------------------
      # 5. Extract source ZIP
      # ------------------------------------------------------------
      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Extracting:"
          echo "${SOURCE_ZIP_PATH}"

          unzip -q "${SOURCE_ZIP_PATH}" -d "${PROJECT_DIR}"

          echo
          echo "Extracted tree:"
          find "${PROJECT_DIR}" -maxdepth 3 -type f | sort | head -n 300

      # ------------------------------------------------------------
      # 6. Normalize ZIP root
      # ------------------------------------------------------------
      - name: Detect Flutter project root
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "${PROJECT_DIR}/pubspec.yaml" ]]; then
            DETECTED_ROOT="${PROJECT_DIR}"
          else
            DETECTED_ROOT="$(
              find "${PROJECT_DIR}" \
                -type f \
                -name "pubspec.yaml" \
                -not -path "*/.dart_tool/*" \
                | head -n 1 \
                | xargs -r dirname
            )"
          fi

          if [[ -z "${DETECTED_ROOT}" || ! -f "${DETECTED_ROOT}/pubspec.yaml" ]]; then
            echo "ERROR: Could not find pubspec.yaml."
            exit 1
          fi

          echo "Detected Flutter project root:"
          echo "${DETECTED_ROOT}"

          echo "PROJECT_ROOT=${DETECTED_ROOT}" >> "${GITHUB_ENV}"

      # ------------------------------------------------------------
      # 7. Install Java
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ------------------------------------------------------------
      # 8. Set up Flutter
      # ------------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
          flutter-version: "3.47.1"
          cache: true

      # ------------------------------------------------------------
      # 9. Flutter doctor
      # ------------------------------------------------------------
      - name: Flutter doctor
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          flutter --version
          flutter doctor -v

      # ------------------------------------------------------------
      # 10. Android SDK / NDK preparation
      # ------------------------------------------------------------
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"

          sdkmanager \
            "ndk;${NDK_VERSION}" || true

      # ------------------------------------------------------------
      # 11. Dependency inspection
      # ------------------------------------------------------------
      - name: Flutter dependency audit
        if: ${{ inputs.run_security }}
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -o pipefail

          {
            echo "===== flutter pub deps ====="
            flutter pub deps

            echo
            echo "===== pubspec.yaml ====="
            cat pubspec.yaml

            echo
            echo "===== Flutter outdated packages ====="
            flutter pub outdated || true
          } 2>&1 | tee "${AUDIT_DIR}/reports/flutter-dependencies.txt"

      # ------------------------------------------------------------
      # 12. Fetch dependencies
      # ------------------------------------------------------------
      - name: Flutter pub get
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          flutter pub get

      # ------------------------------------------------------------
      # 13. Source integrity / hygiene scan
      # ------------------------------------------------------------
      - name: Source hygiene audit
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -o pipefail

          {
            echo "===== Large files ====="
            find . \
              -type f \
              -not -path "./.git/*" \
              -not -path "./build/*" \
              -size +10M \
              -print \
              | sort

            echo
            echo "===== Potential secrets ====="

            grep -RInE \
              --exclude-dir=.git \
              --exclude-dir=build \
              --exclude-dir=.dart_tool \
              --exclude='*.lock' \
              '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}|password[[:space:]]*[:=]|secret[[:space:]]*[:=]|api[_-]?key[[:space:]]*[:=])' \
              . \
              || true

            echo
            echo "===== TODO / FIXME ====="

            grep -RInE \
              --exclude-dir=.git \
              --exclude-dir=build \
              --exclude-dir=.dart_tool \
              '(TODO|FIXME|HACK|XXX)' \
              . \
              || true

          } 2>&1 | tee "${AUDIT_DIR}/reports/source-hygiene.txt"

      # ------------------------------------------------------------
      # 14. Flutter static analysis
      # ------------------------------------------------------------
      - name: Flutter analyze
        if: ${{ inputs.run_staging }}
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -o pipefail

          flutter analyze \
            --no-fatal-infos \
            2>&1 | tee "${AUDIT_DIR}/reports/flutter-analyze.txt"

      # ------------------------------------------------------------
      # 15. Dart formatting check
      # ------------------------------------------------------------
      - name: Dart format check
        if: ${{ inputs.run_staging }}
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -o pipefail

          dart format --output=none --set-exit-if-changed lib test \
            2>&1 | tee "${AUDIT_DIR}/reports/dart-format.txt"

      # ------------------------------------------------------------
      # 16. Automated tests
      # ------------------------------------------------------------
      - name: Flutter tests
        if: ${{ inputs.run_tests }}
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -o pipefail

          flutter test --coverage \
            2>&1 | tee "${AUDIT_DIR}/reports/flutter-tests.txt"

      # ------------------------------------------------------------
      # 17. Android project validation
      # ------------------------------------------------------------
      - name: Android project validation
        if: ${{ inputs.run_staging }}
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -o pipefail

          {
            echo "===== Android files ====="
            find android -maxdepth 4 -type f | sort

            echo
            echo "===== Gradle versions ====="

            if [[ -f android/gradle/wrapper/gradle-wrapper.properties ]]; then
              cat android/gradle/wrapper/gradle-wrapper.properties
            fi

            echo
            echo "===== Android build configuration ====="

            if [[ -f android/build.gradle ]]; then
              cat android/build.gradle
            fi

            if [[ -f android/build.gradle.kts ]]; then
              cat android/build.gradle.kts
            fi

            if [[ -f android/app/build.gradle ]]; then
              cat android/app/build.gradle
            fi

            if [[ -f android/app/build.gradle.kts ]]; then
              cat android/app/build.gradle.kts
            fi

          } 2>&1 | tee "${AUDIT_DIR}/reports/android-validation.txt"

      # ------------------------------------------------------------
      # 18. Flutter staging APK build
      # ------------------------------------------------------------
      - name: Build staging APK
        if: ${{ inputs.run_staging }}
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -o pipefail

          flutter clean
          flutter pub get

          flutter build apk \
            --debug \
            --verbose \
            2>&1 | tee "${AUDIT_DIR}/logs/staging-build.log"

      # ------------------------------------------------------------
      # 19. Locate APK
      # ------------------------------------------------------------
      - name: Locate generated APK
        if: ${{ inputs.run_staging }}
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          mkdir -p "${AUDIT_DIR}/artifacts"

          echo "APK files:"
          find build/app/outputs -type f \
            \( -iname "*.apk" -o -iname "*.aab" \) \
            -print | sort || true

          APK_PATH="$(
            find build/app/outputs \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [[ -z "${APK_PATH}" ]]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK_PATH=${APK_PATH}" >> "${GITHUB_ENV}"

          cp "${APK_PATH}" "${AUDIT_DIR}/artifacts/"

          sha256sum "${APK_PATH}" \
            | tee "${AUDIT_DIR}/reports/apk-sha256.txt"

          ls -lh "${APK_PATH}"

      # ------------------------------------------------------------
      # 20. APK metadata
      # ------------------------------------------------------------
      - name: APK metadata
        if: ${{ inputs.run_staging }}
        shell: bash
        run: |
          set -o pipefail

          APK="${APK_PATH}"

          {
            echo "===== APK ====="
            ls -lh "${APK}"

            echo
            echo "===== SHA256 ====="
            sha256sum "${APK}"

            echo
            echo "===== File ====="
            file "${APK}"

          } 2>&1 | tee "${AUDIT_DIR}/reports/apk-metadata.txt"

      # ------------------------------------------------------------
      # 21. Release APK build
      # ------------------------------------------------------------
      - name: Build release APK
        if: ${{ inputs.build_release }}
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -o pipefail

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --verbose \
            2>&1 | tee "${AUDIT_DIR}/logs/release-build.log"

      # ------------------------------------------------------------
      # 22. Release artifact discovery
      # ------------------------------------------------------------
      - name: Collect release artifacts
        if: ${{ inputs.build_release }}
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          mkdir -p "${AUDIT_DIR}/release"

          find build/app/outputs \
            -type f \
            \( -iname "*.apk" -o -iname "*.aab" \) \
            -exec cp {} "${AUDIT_DIR}/release/" \; \
            || true

          if compgen -G "${AUDIT_DIR}/release/*" > /dev/null; then
            sha256sum "${AUDIT_DIR}/release/"* \
              | tee "${AUDIT_DIR}/reports/release-sha256.txt"
          else
            echo "No release artifacts found."
          fi

      # ------------------------------------------------------------
      # 23. Git / repository audit
      # ------------------------------------------------------------
      - name: Repository audit
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -o pipefail

          {
            echo "===== Git status ====="
            git status --short 2>/dev/null || true

            echo
            echo "===== Top-level files ====="
            find . -maxdepth 2 -type f \
              -not -path "./.git/*" \
              | sort

            echo
            echo "===== pubspec ====="
            sed -n '1,240p' pubspec.yaml

          } 2>&1 | tee "${AUDIT_DIR}/reports/repository-audit.txt"

      # ------------------------------------------------------------
      # 24. Generate final audit summary
      # ------------------------------------------------------------
      - name: Generate audit summary
        if: always()
        shell: bash
        run: |
          set -u

          SUMMARY="${AUDIT_DIR}/HOPE-FULL-AUDIT-SUMMARY.md"

          {
            echo "# HOPE Full Audit"
            echo
            echo "**Repository:** ${GITHUB_REPOSITORY}"
            echo
            echo "**Commit:** ${GITHUB_SHA}"
            echo
            echo "**Workflow:** ${GITHUB_WORKFLOW}"
            echo
            echo "**Run:** ${GITHUB_RUN_NUMBER}"
            echo
            echo "## Configuration"
            echo
            echo "- Flutter channel: ${FLUTTER_CHANNEL}"
            echo "- Java: ${JAVA_VERSION}"
            echo "- Android API: ${ANDROID_API}"
            echo "- NDK: ${NDK_VERSION}"
            echo "- Run staging: ${{ inputs.run_staging }}"
            echo "- Run security: ${{ inputs.run_security }}"
            echo "- Run tests: ${{ inputs.run_tests }}"
            echo "- Build release: ${{ inputs.build_release }}"
            echo
            echo "## Source"
            echo
            echo "- ZIP: ${SOURCE_ZIP_PATH:-unknown}"
            echo "- Project root: ${PROJECT_ROOT:-unknown}"
            echo
            echo "## Generated files"
            echo
            find "${AUDIT_DIR}" -maxdepth 3 -type f \
              -printf '%P\n' \
              | sort
            echo
            echo "## Workflow result"
            echo
            echo "Check the individual GitHub Actions steps for pass/fail details."
          } > "${SUMMARY}"

          cat "${SUMMARY}"

      # ------------------------------------------------------------
      # 25. Upload audit reports
      # ------------------------------------------------------------
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hope-full-audit-${{ github.run_number }}
          path: |
            ${{ env.AUDIT_DIR }}/
          if-no-files-found: warn
          retention-days: 14
