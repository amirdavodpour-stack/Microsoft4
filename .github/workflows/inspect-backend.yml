name: Inspect HOPE Backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP and inspect database files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .inspect
          mkdir -p .inspect/source

          ARCHIVE="$(find . -maxdepth 1 -type f -iname '*.zip' -print | sort | head -n 1)"

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: No ZIP archive found."
            exit 1
          fi

          echo "Using archive: $ARCHIVE"

          unzip -q "$ARCHIVE" -d .inspect/source

          DB_FILE="$(find .inspect/source -type f -path '*/backend/src/db.js' -print | head -n 1)"
          MIGRATE_FILE="$(find .inspect/source -type f -path '*/backend/src/migrate.js' -print | head -n 1)"
          SCHEMA_FILE="$(find .inspect/source -type f -path '*/backend/src/db/schema.js' -print | head -n 1)"

          if [ -z "$DB_FILE" ]; then
            echo "ERROR: backend/src/db.js was not found."
            exit 1
          fi

          echo
          echo "================ db.js ================"
          nl -ba "$DB_FILE"

          echo
          echo "================ migrate.js ================"

          if [ -n "$MIGRATE_FILE" ]; then
            nl -ba "$MIGRATE_FILE"
          else
            echo "migrate.js not found"
          fi

          echo
          echo "================ schema.js ================"

          if [ -n "$SCHEMA_FILE" ]; then
            nl -ba "$SCHEMA_FILE"
          else
            echo "schema.js not found"
          fi

          echo
          echo "================ related database files ================"

          find .inspect/source -type f \
            \( \
              -path '*/backend/src/db/*' \
              -o -path '*/backend/src/*migration*' \
              -o -path '*/backend/migrations/*' \
            \) \
            -print | sort
