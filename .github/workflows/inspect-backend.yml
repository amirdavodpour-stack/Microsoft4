name: Inspect HOPE DB Schema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP and show database schema
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .inspect
          mkdir -p .inspect/source

          ARCHIVE="$(find . -maxdepth 1 -type f -iname '*.zip' -print | sort | head -n 1)"

          test -n "$ARCHIVE"

          unzip -q "$ARCHIVE" -d .inspect/source

          SCHEMA_FILE="$(find .inspect/source -type f -path '*/backend/src/db/schema.js' -print | head -n 1)"

          test -n "$SCHEMA_FILE"

          echo "================ notification_preferences ================"

          grep -n -B 10 -A 30 "notification_preferences" "$SCHEMA_FILE" || true

          echo
          echo "================ all CREATE TABLE statements ================"

          grep -n "CREATE TABLE" "$SCHEMA_FILE" || true

          echo
          echo "================ schema.js first 220 lines ================"

          nl -ba "$SCHEMA_FILE" | head -n 220
