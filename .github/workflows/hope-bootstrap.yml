name: HOPE ZIP Bootstrap

on:
  workflow_dispatch:
    inputs:
      archive:
        description: "ZIP filename in repository (leave blank to auto-detect)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: hope-zip-bootstrap-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_ZIP: HOPE-3_8_0-GITHUB-ZIP-AUTO-BUILD-READY-V5-SELF-HEALING.zip
  FLUTTER_VERSION: "3.47.0"
  JAVA_VERSION: "17"
  BUILD_PROFILE: "pilot"

jobs:
  build:
    name: HOPE APK Self-Healing Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate source ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="${{ inputs.archive }}"

          if [[ -n "$ARCHIVE" ]]; then
            if [[ ! -f "$ARCHIVE" ]]; then
              echo "Requested archive not found: $ARCHIVE"
              exit 1
            fi
            SOURCE="$ARCHIVE"
          elif [[ -f "$SOURCE_ZIP" ]]; then
            SOURCE="$SOURCE_ZIP"
          else
            SOURCE="$(find . -maxdepth 3 -type f \
              \( -name 'HOPE-*.zip' -o -name '*.zip' \) \
              | sort | head -n 1)"
          fi

          if [[ -z "${SOURCE:-}" ]]; then
            echo "No ZIP archive found."
            exit 1
          fi

          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "Using archive: $SOURCE"

      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "${{ steps.locate_zip.outputs.source }}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show toolchain
        shell: bash
        run: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v || true

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .hope-project
          mkdir -p .hope-project

          unzip -q "${{ steps.locate_zip.outputs.source }}" -d .hope-project

          if [[ -f ".hope-project/pubspec.yaml" ]]; then
            PROJECT_ROOT=".hope-project"
          else
            PROJECT_ROOT="$(find .hope-project -maxdepth 3 -name pubspec.yaml -print -quit \
              | xargs -r dirname)"
          fi

          if [[ -z "${PROJECT_ROOT:-}" || ! -f "$PROJECT_ROOT/pubspec.yaml" ]]; then
            echo "Flutter project not found after extraction."
            find .hope-project -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_ROOT"

      - name: Validate Flutter project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_ROOT/pubspec.yaml"
          test -d "$PROJECT_ROOT/android"
          test -f "$PROJECT_ROOT/android/gradlew"

          cd "$PROJECT_ROOT"

          flutter pub get
          flutter gen-l10n || true

          # Regenerate Flutter Android configuration and
          # GeneratedPluginRegistrant for integration_test.
          flutter build --config-only

      - name: Validate API configuration
        shell: bash
        env:
          INPUT_API_BASE_URL: ${{ vars.API_BASE_URL }}
          SECRET_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail

          API_BASE_URL_VALUE="${SECRET_API_BASE_URL:-${INPUT_API_BASE_URL:-}}"

          if [[ -z "$API_BASE_URL_VALUE" ]]; then
            echo "API_BASE_URL is not configured."
            echo "Create a GitHub Actions Variable or Secret named API_BASE_URL."
            exit 1
          fi

          if [[ ! "$API_BASE_URL_VALUE" =~ ^https:// ]]; then
            echo "API_BASE_URL must start with https://"
            exit 1
          fi

          echo "API_BASE_URL configured successfully."

      - name: Align Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          chmod +x android/gradlew

          ./android/gradlew --version || true

      - name: Preflight cleanup and configuration
        shell: bash
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || vars.API_BASE_URL }}
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          ./android/gradlew --stop || true

          rm -rf \
            build \
            .dart_tool \
            .gradle \
            android/.gradle \
            android/build \
            android/app/build

          flutter clean
          flutter pub get
          flutter gen-l10n || true

          # CRITICAL FIX:
          # Regenerate Flutter Android configuration before
          # the final --no-pub APK build.
          flutter build --config-only

          test -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java

          echo "GeneratedPluginRegistrant.java:"
          sed -n '1,120p' \
            android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java

      - name: Build APK with self-healing attempts
        shell: bash
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || vars.API_BASE_URL }}
        run: |
          set -euo pipefail

          BASE_PROJECT="$PROJECT_ROOT"
          SUCCESS=0

          for ATTEMPT in 1 2 3; do
            echo "============================================================"
            echo "BUILD ATTEMPT $ATTEMPT / 3"
            echo "============================================================"

            ATTEMPT_DIR="$GITHUB_WORKSPACE/.hope-attempt-$ATTEMPT"
            GRADLE_HOME="$GITHUB_WORKSPACE/.gradle-attempt-$ATTEMPT"

            rm -rf "$ATTEMPT_DIR" "$GRADLE_HOME"

            cp -a "$BASE_PROJECT" "$ATTEMPT_DIR"
            mkdir -p "$GRADLE_HOME"

            chmod +x "$ATTEMPT_DIR/android/gradlew"

            export GRADLE_USER_HOME="$GRADLE_HOME"
            export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=false -Dorg.gradle.configuration-cache=false"

            cd "$ATTEMPT_DIR"

            ./android/gradlew --stop || true

            rm -rf \
              build \
              .dart_tool \
              .gradle \
              android/.gradle \
              android/build \
              android/app/build

            flutter clean

            flutter pub get
            flutter gen-l10n || true

            # CRITICAL:
            # Regenerate GeneratedPluginRegistrant after every
            # isolated copy and before --no-pub.
            flutter build --config-only

            if [[ ! -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java ]]; then
              echo "GeneratedPluginRegistrant.java was not generated."
              exit 1
            fi

            echo "Checking generated plugin registrant..."

            if grep -n "integration_test" \
              android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java; then
              echo "integration_test registration detected."
            fi

            set +e

            flutter build apk \
              --release \
              --dart-define="API_BASE_URL=$API_BASE_URL" \
              --dart-define="BUILD_PROFILE=$BUILD_PROFILE" \
              --no-pub

            BUILD_EXIT=$?

            set -e

            if [[ "$BUILD_EXIT" -eq 0 ]]; then
              APK_PATH="$(find build/app/outputs/apk \
                -type f \
                -name '*.apk' \
                -print -quit)"

              if [[ -n "${APK_PATH:-}" && -f "$APK_PATH" ]]; then
                APK_SIZE="$(stat -c%s "$APK_PATH")"

                if [[ "$APK_SIZE" -gt 1000000 ]]; then
                  echo "APK successfully built:"
                  echo "$APK_PATH"
                  echo "APK size: $APK_SIZE bytes"

                  mkdir -p "$GITHUB_WORKSPACE/artifacts"

                  cp "$APK_PATH" \
                    "$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0+11-pilot.apk"

                  SUCCESS=1
                  break
                fi
              fi
            fi

            echo "Attempt $ATTEMPT failed."

            echo "Recent diagnostics:"
            find . -type f \
              \( -name '*.log' -o -name 'GeneratedPluginRegistrant.java' \) \
              | head -50 || true

            cd "$GITHUB_WORKSPACE"
          done

          if [[ "$SUCCESS" -ne 1 ]]; then
            echo "All APK build attempts failed."
            exit 1
          fi

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p diagnostics

          echo "=== Repository ===" > diagnostics/diagnostics.txt
          git rev-parse HEAD >> diagnostics/diagnostics.txt

          echo "=== Flutter ===" >> diagnostics/diagnostics.txt
          flutter --version >> diagnostics/diagnostics.txt 2>&1

          echo "=== Project ===" >> diagnostics/diagnostics.txt
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> diagnostics/diagnostics.txt

          find .hope-project -maxdepth 3 -type f \
            | sort \
            | head -200 \
            > diagnostics/project-files.txt

          for ATTEMPT in 1 2 3; do
            if [[ -d ".hope-attempt-$ATTEMPT" ]]; then
              find ".hope-attempt-$ATTEMPT" -type f \
                \( -name '*.log' -o -name 'GeneratedPluginRegistrant.java' \) \
                | sort \
                | head -100 \
                > "diagnostics/attempt-$ATTEMPT-files.txt"
            fi
          done

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-3.8.0+11-pilot-apk
          path: artifacts/HOPE-3.8.0+11-pilot.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-bootstrap-diagnostics
          path: diagnostics
          if-no-files-found: ignore
          retention-days: 7
