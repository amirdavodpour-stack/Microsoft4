name: HOPE ZIP Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hope-zip-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: HOPE ZIP Auto Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BUILD_PROFILE: pilot
      CI_ZIP_BUILD: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate HOPE ZIP
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE=""

          for file in HOPE-*.zip; do
            if [ -f "$file" ]; then
              ARCHIVE="$file"
              break
            fi
          done

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: HOPE ZIP not found."
            exit 1
          fi

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "Using archive: $ARCHIVE"

      - name: Extract HOPE project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .hope-work
          mkdir -p .hope-work/source

          unzip -q "${{ steps.locate.outputs.archive }}" -d .hope-work/source

          echo "Searching for Flutter project..."

          PROJECT_DIR="$(find .hope-work/source -type f -name pubspec.yaml -print -quit | xargs dirname)"

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: Flutter project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project:"
          echo "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "HOPE TOOLCHAIN"
          echo "========================================"

          flutter --version
          dart --version
          java -version

          echo "========================================"

      - name: Configure API_BASE_URL
        shell: bash
        env:
          API_BASE_URL_SECRET: ${{ secrets.API_BASE_URL }}
          API_BASE_URL_VARIABLE: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail

          API_BASE_URL="${API_BASE_URL_SECRET:-}"

          if [ -z "$API_BASE_URL" ]; then
            API_BASE_URL="${API_BASE_URL_VARIABLE:-}"
          fi

          if [ -z "$API_BASE_URL" ]; then
            echo "ERROR: API_BASE_URL is not configured."
            echo ""
            echo "Configure:"
            echo "Repository -> Settings -> Secrets and variables -> Actions"
            echo ""
            echo "Name:"
            echo "API_BASE_URL"
            echo ""
            echo "Expected:"
            echo "https://YOUR-API-HOST/api/v1"
            exit 1
          fi

          case "$API_BASE_URL" in
            http://*|https://*)
              ;;
            *)
              echo "ERROR: API_BASE_URL must start with http:// or https://"
              exit 1
              ;;
          esac

          echo "API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"

          echo "API_BASE_URL configured: yes"

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "Preparing Android project"
          echo "========================================"

          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i \
              's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip#' \
              android/gradle/wrapper/gradle-wrapper.properties
          fi

          echo "Gradle:"
          grep "distributionUrl" android/gradle/wrapper/gradle-wrapper.properties || true

          flutter clean
          flutter pub get

      - name: Verify application configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "HOPE BUILD CONFIGURATION"
          echo "========================================"
          echo "BUILD_PROFILE=$BUILD_PROFILE"
          echo "Flutter=3.47.0"
          echo "API_BASE_URL configured=yes"
          echo "========================================"

          test -f pubspec.yaml
          test -d android
          test -f android/gradlew

      - name: Flutter analyzer
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Running Flutter analyzer..."

          flutter analyze

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "HOPE Android APK Build"
          echo "BUILD_PROFILE=$BUILD_PROFILE"
          echo "Flutter=3.47.0"
          echo "API_BASE_URL configured=yes"
          echo "========================================"

          echo "Building directly with Flutter."
          echo "Skipping tools/build_apk_release.sh CI toolchain guard."

          flutter build apk \
            --release \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="BUILD_PROFILE=$BUILD_PROFILE"

          echo "========================================"
          echo "Flutter APK build finished."
          echo "========================================"

      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Searching
