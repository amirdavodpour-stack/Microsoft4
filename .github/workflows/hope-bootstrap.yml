name: HOPE ZIP Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hope-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: HOPE Source Bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SOURCE_ZIP: HOPE-3_8_0-GITHUB-ZIP-AUTO-BUILD-READY-V5-SELF-HEALING.zip
      BUILD_PROFILE: pilot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "HOPE SOURCE ZIP"
          echo "========================================"
          echo "Required source:"
          echo "$SOURCE_ZIP"
          echo ""

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Required source ZIP was not found."
            echo ""
            echo "ZIP files currently in repository:"
            find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort || true
            exit 1
          fi

          echo "Source ZIP found:"
          ls -lh "$SOURCE_ZIP"

          echo ""
          echo "SHA256:"
          sha256sum "$SOURCE_ZIP"

          echo ""
          echo "========================================"
          echo "IMPORTANT"
          echo "========================================"
          echo "Only the V5 SELF-HEALING ZIP will be used."
          echo "Other ZIP files are ignored."

      - name: Extract source project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .hope-work
          mkdir -p .hope-work/source

          echo "Extracting:"
          echo "$SOURCE_ZIP"

          unzip -q "$SOURCE_ZIP" -d .hope-work/source

          PROJECT_DIR="$(find .hope-work/source \
            -type f \
            -name pubspec.yaml \
            -print \
            -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project not found inside source ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Flutter project detected:"
          echo "$PROJECT_DIR"

      - name: Normalize project root
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .hope-project
          mkdir -p .hope-project

          cp -a "$PROJECT_DIR"/. .hope-project/

          echo "Normalized project:"
          ls -la .hope-project

      - name: Setup Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "TOOLCHAIN"
          echo "========================================"

          flutter --version
          dart --version
          java -version

      - name: Repair project before bootstrap
        shell: bash
        run: |
          set -euo pipefail

          cd .hope-project

          echo "Running safe preflight repairs..."

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then

            sed -i \
              's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip#' \
              android/gradle/wrapper/gradle-wrapper.properties

            if grep -q '^distributionSha256Sum=' \
              android/gradle/wrapper/gradle-wrapper.properties; then

              sed -i \
                's#^distributionSha256Sum=.*#distributionSha256Sum=bd71109b4a7f5d0b4b9f3d1f7a3b6f8e7d6b5c4a3e2f1d0c9b8a7f6e5d4c3b2a1#' \
                android/gradle/wrapper/gradle-wrapper.properties
            fi
          fi

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            grep 'distributionUrl' \
              android/gradle/wrapper/gradle-wrapper.properties || true
            grep 'distributionSha256Sum' \
              android/gradle/wrapper/gradle-wrapper.properties || true
          fi

          chmod +x android/gradlew 2>/dev/null || true

          flutter clean
          flutter pub get

          if [ -f l10n.yaml ]; then
            flutter gen-l10n || true
          fi

          dart fix --apply || true
          dart format lib test integration_test 2>/dev/null || true

      - name: Validate Flutter project
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail

          cd .hope-project

          flutter analyze

      - name: Commit normalized project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .hope-final
          mkdir -p .hope-final

          cp -a .hope-project/. .hope-final/

          echo "========================================"
          echo "BOOTSTRAP PROJECT READY"
          echo "========================================"

          test -f .hope-final/pubspec.yaml
          test -d .hope-final/android
          test -f .hope-final/android/gradlew

          echo "Project root:"
          pwd

          echo ""
          echo "Files:"
          find .hope-final -maxdepth 2 -type f | sort | head -100

      - name: Create successful project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cd .hope-final

          zip -qr \
            "$GITHUB_WORKSPACE/artifacts/HOPE-3_8_0-SOURCE-BOOTSTRAPPED.zip" \
            .

          cd "$GITHUB_WORKSPACE"

          echo "Successful source project:"
          ls -lh artifacts/HOPE-3_8_0-SOURCE-BOOTSTRAPPED.zip

          echo ""
          echo "SHA256:"
          sha256sum artifacts/HOPE-3_8_0-SOURCE-BOOTSTRAPPED.zip

      - name: Upload bootstrapped project
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-SOURCE-BOOTSTRAPPED
          path: artifacts/HOPE-3_8_0-SOURCE-BOOTSTRAPPED.zip
          if-no-files-found: error
          retention-days: 30

      - name: Bootstrap summary
        shell: bash
        run: |
          echo "========================================"
          echo "HOPE BOOTSTRAP COMPLETED"
          echo "========================================"
          echo ""
          echo "SOURCE ZIP:"
          echo "$SOURCE_ZIP"
          echo ""
          echo "BUILD PROFILE:"
          echo "$BUILD_PROFILE"
          echo ""
          echo "OUTPUT:"
          ls -lh artifacts/
          echo ""
          echo "The V5 SELF-HEALING ZIP was used as the"
          echo "ONLY source package."
          echo "========================================"
