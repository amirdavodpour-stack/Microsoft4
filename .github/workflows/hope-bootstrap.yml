name: HOPE ZIP Bootstrap

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "hope-bootstrap-${{ github.ref }}"
  cancel-in-progress: false

env:
  SOURCE_ZIP: "HOPE-3_8_0-GITHUB-ZIP-AUTO-BUILD-READY-V5-SELF-HEALING.zip"
  FLUTTER_VERSION: "3.47.0"
  BUILD_PROFILE: "pilot"
  GRADLE_VERSION: "8.14.3"
  GRADLE_SHA256: "bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531"

jobs:
  build:
    name: HOPE APK Self-Healing Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Required source ZIP not found:"
            echo "$SOURCE_ZIP"
            echo
            echo "ZIP files currently in repository:"
            find . -maxdepth 2 -type f -name "*.zip" -printf "%p\n" | sort || true
            exit 1
          fi

          echo "Using source ZIP:"
          echo "$SOURCE_ZIP"

          echo
          echo "ZIP size:"
          ls -lh "$SOURCE_ZIP"

          echo
          echo "ZIP SHA256:"
          sha256sum "$SOURCE_ZIP"

      - name: Extract source project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .hope-work
          rm -rf .hope-project

          mkdir -p .hope-work/source
          mkdir -p .hope-project

          unzip -q "$SOURCE_ZIP" -d .hope-work/source

          echo "Searching for Flutter project..."

          PUBSPEC_PATH="$(
            find .hope-work/source \
              -type f \
              -name "pubspec.yaml" \
              -print \
              -quit
          )"

          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: No pubspec.yaml found inside source ZIP."
            echo
            echo "Extracted files:"
            find .hope-work/source -maxdepth 4 -type f | sort | head -n 300
            exit 1
          fi

          PROJECT_SOURCE_DIR="$(dirname "$PUBSPEC_PATH")"

          echo "Found Flutter project:"
          echo "$PROJECT_SOURCE_DIR"

          cp -a "$PROJECT_SOURCE_DIR"/. .hope-project/

          test -f ".hope-project/pubspec.yaml"

          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/.hope-project" >> "$GITHUB_ENV"

          echo
          echo "Project copied to:"
          echo "$GITHUB_WORKSPACE/.hope-project"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FLUTTER"
          echo "========================================"

          flutter --version

          echo
          echo "========================================"
          echo "DART"
          echo "========================================"

          dart --version

          echo
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

      - name: Verify API configuration
        shell: bash
        env:
          API_BASE_URL_SECRET: ${{ secrets.API_BASE_URL }}
          API_BASE_URL_VARIABLE: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail

          API_VALUE="${API_BASE_URL_SECRET:-}"

          if [ -z "$API_VALUE" ]; then
            API_VALUE="${API_BASE_URL_VARIABLE:-}"
          fi

          if [ -z "$API_VALUE" ]; then
            echo "ERROR: API_BASE_URL is not configured."
            echo
            echo "Create a GitHub Actions Repository Secret or Variable:"
            echo "API_BASE_URL"
            exit 1
          fi

          case "$API_VALUE" in
            https://*)
              ;;
            *)
              echo "ERROR: API_BASE_URL must use HTTPS."
              exit 1
              ;;
          esac

          {
            echo "API_BASE_URL=$API_VALUE"
            echo "BUILD_PROFILE=$BUILD_PROFILE"
          } >> "$GITHUB_ENV"

          echo "API_BASE_URL configuration verified."

      - name: Preflight project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          pwd

          test -f pubspec.yaml
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo
          echo "========================================"
          echo "GRADLE WRAPPER"
          echo "========================================"

          sed -i \
            "s#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip#" \
            android/gradle/wrapper/gradle-wrapper.properties

          if grep -q "^distributionSha256Sum=" \
            android/gradle/wrapper/gradle-wrapper.properties; then

            sed -i \
              "s#^distributionSha256Sum=.*#distributionSha256Sum=${GRADLE_SHA256}#" \
              android/gradle/wrapper/gradle-wrapper.properties

          else

            printf "\ndistributionSha256Sum=%s\n" \
              "$GRADLE_SHA256" \
              >> android/gradle/wrapper/gradle-wrapper.properties

          fi

          chmod +x android/gradlew

          grep "^distributionUrl=" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep "^distributionSha256Sum=" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo
          echo "========================================"
          echo "FLUTTER CLEAN"
          echo "========================================"

          flutter clean

          echo
          echo "========================================"
          echo "FLUTTER PUB GET"
          echo "========================================"

          flutter pub get

          if [ -f "l10n.yaml" ]; then
            echo
            echo "========================================"
            echo "GENERATE LOCALIZATION"
            echo "========================================"

            flutter gen-l10n
          fi

          echo
          echo "========================================"
          echo "TOOLCHAIN ALIGNMENT"
          echo "========================================"

          if [ -f "tools/verify_toolchain_alignment.py" ]; then
            python3 tools/verify_toolchain_alignment.py
          else
            echo "Toolchain alignment script not present; continuing."
          fi

      - name: Build APK with retries
        shell: bash
        run: |
          set -u

          cd "$PROJECT_ROOT"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          MAX_ATTEMPTS=3
          BUILD_OK=0

          for ATTEMPT in 1 2 3; do

            echo
            echo "========================================"
            echo "HOPE APK BUILD ATTEMPT $ATTEMPT / $MAX_ATTEMPTS"
            echo "========================================"
            echo

            rm -rf build/app/outputs/flutter-apk/*.apk 2>/dev/null || true

            flutter clean || true
            flutter pub get || true

            if [ -f "l10n.yaml" ]; then
              flutter gen-l10n || true
            fi

            set +e

            flutter build apk \
              --release \
              --dart-define="API_BASE_URL=$API_BASE_URL" \
              --dart-define="BUILD_PROFILE=$BUILD_PROFILE" \
              2>&1 | tee \
              "$GITHUB_WORKSPACE/artifacts/build-attempt-${ATTEMPT}.log"

            RC=${PIPESTATUS[0]}

            set -e

            if [ "$RC" -eq 0 ] && \
              find build/app/outputs/flutter-apk \
                -maxdepth 1 \
                -type f \
                -name "*.apk" \
                -print \
                -quit \
                | grep -q .; then

              BUILD_OK=1

              echo
              echo "========================================"
              echo "BUILD SUCCESS"
              echo "========================================"

              break
            fi

            echo
            echo "========================================"
            echo "BUILD FAILED"
            echo "========================================"

            echo "Attempt: $ATTEMPT"
            echo "Exit code: $RC"

            echo
            echo "Running safe Dart repairs..."

            dart fix --apply || true

            dart format \
              lib \
              test \
              integration_test \
              2>/dev/null || true

          done

          if [ "$BUILD_OK" -ne 1 ]; then

            echo
            echo "========================================"
            echo "APK BUILD FAILED AFTER 3 ATTEMPTS"
            echo "========================================"

            flutter analyze \
              2>&1 | tee \
              "$GITHUB_WORKSPACE/artifacts/final-analyze.log" \
              || true

            exit 1
          fi

          APK="$(
            find build/app/outputs/flutter-apk \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not found."
            exit 1
          fi

          test -s "$APK"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0-pilot.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0-pilot.apk" \
            | tee \
            "$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0-pilot.apk.sha256"

          echo
          echo "APK CREATED:"
          ls -lh \
            "$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0-pilot.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="artifacts/HOPE-3.8.0-pilot.apk"

          test -s "$APK"

          echo "APK file:"
          ls -lh "$APK"

          echo
          echo "APK type:"

          file "$APK" || true

          if command -v apksigner >/dev/null 2>&1; then

            echo
            echo "Running APK signature verification..."

            apksigner verify \
              --verbose \
              "$APK"

          else

            echo
            echo "apksigner is not available on this runner."

          fi

      - name: Create successful project ZIP
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$PROJECT_ROOT"

          rm -rf \
            "$PROJECT/.dart_tool" \
            "$PROJECT/build" \
            "$PROJECT/node_modules" \
            "$PROJECT/.gradle" \
            "$PROJECT/.git"

          find "$PROJECT" \
            -type f \
            \( \
              -name "*.apk" \
              -o -name "*.aab" \
              -o -name "*.jks" \
              -o -name "*.keystore" \
              -o -name ".env" \
              -o -name "key.properties" \
            \) \
            -delete

          cd "$PROJECT"

          zip -qr \
            "$GITHUB_WORKSPACE/artifacts/HOPE_3_8_0-SUCCESSFUL-PROJECT.zip" \
            .

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            "artifacts/HOPE_3_8_0-SUCCESSFUL-PROJECT.zip" \
            | tee \
            "artifacts/HOPE_3_8_0-SUCCESSFUL-PROJECT.zip.sha256"

          echo
          echo "Successful project ZIP:"
          ls -lh \
            "artifacts/HOPE_3_8_0-SUCCESSFUL-PROJECT.zip"

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          echo "========================================" \
            > "$GITHUB_WORKSPACE/artifacts/workflow-summary.txt"

          echo "HOPE BUILD DIAGNOSTICS" \
            >> "$GITHUB_WORKSPACE/artifacts/workflow-summary.txt"

          echo "========================================" \
            >> "$GITHUB_WORKSPACE/artifacts/workflow-summary.txt"

          echo "Repository: $GITHUB_REPOSITORY" \
            >> "$GITHUB_WORKSPACE/artifacts/workflow-summary.txt"

          echo "Commit: $GITHUB_SHA" \
            >> "$GITHUB_WORKSPACE/artifacts/workflow-summary.txt"

          echo "Run ID: $GITHUB_RUN_ID" \
            >> "$GITHUB_WORKSPACE/artifacts/workflow-summary.txt"

          echo "Ref: $GITHUB_REF" \
            >> "$GITHUB_WORKSPACE/artifacts/workflow-summary.txt"

          flutter doctor -v \
            > "$GITHUB_WORKSPACE/artifacts/flutter-doctor.txt" \
            2>&1 || true

          flutter --version \
            > "$GITHUB_WORKSPACE/artifacts/flutter-version.txt" \
            2>&1 || true

          java -version \
            > "$GITHUB_WORKSPACE/artifacts/java-version.txt" \
            2>&1 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-3.8.0-APK
          path: |
            artifacts/HOPE-3.8.0-pilot.apk
            artifacts/HOPE-3.8.0-pilot.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload successful project
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-3.8.0-SUCCESSFUL-PROJECT
          path: |
            artifacts/HOPE_3_8_0-SUCCESSFUL-PROJECT.zip
            artifacts/HOPE_3_8_0-SUCCESSFUL-PROJECT.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-3.8.0-BUILD-DIAGNOSTICS
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Final summary
        if: always()
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "HOPE BUILD FINISHED"
          echo "========================================"

          if [ -f "artifacts/HOPE-3.8.0-pilot.apk" ]; then
            echo "APK: SUCCESS"
            ls -lh "artifacts/HOPE-3.8.0-pilot.apk"
          else
            echo "APK: NOT CREATED"
          fi

          if [ -f "artifacts/HOPE_3_8_0-SUCCESSFUL-PROJECT.zip" ]; then
            echo "PROJECT ZIP: SUCCESS"
            ls -lh "artifacts/HOPE_3_8_0-SUCCESSFUL-PROJECT.zip"
          else
            echo "PROJECT ZIP: NOT CREATED"
          fi
