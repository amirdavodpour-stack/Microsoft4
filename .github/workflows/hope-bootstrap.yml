name: HOPE ZIP Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hope-zip-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: HOPE ZIP Auto Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BUILD_PROFILE: pilot
      CI_ZIP_BUILD: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate HOPE ZIP
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE=""

          for file in HOPE-*.zip; do
            if [ -f "$file" ]; then
              ARCHIVE="$file"
              break
            fi
          done

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: HOPE ZIP not found."
            exit 1
          fi

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "Using archive: $ARCHIVE"

      - name: Extract HOPE project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .hope-work
          mkdir -p .hope-work/source

          unzip -q "${{ steps.locate.outputs.archive }}" -d .hope-work/source

          echo "Searching for Flutter project..."

          PROJECT_DIR="$(find .hope-work/source -type f -name pubspec.yaml -print -quit | xargs dirname)"

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: Flutter project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project:"
          echo "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "HOPE TOOLCHAIN"
          echo "========================================"

          flutter --version
          dart --version
          java -version

          echo "========================================"

      - name: Configure API_BASE_URL
        shell: bash
        env:
          API_BASE_URL_SECRET: ${{ secrets.API_BASE_URL }}
          API_BASE_URL_VARIABLE: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail

          API_BASE_URL="${API_BASE_URL_SECRET:-}"

          if [ -z "$API_BASE_URL" ]; then
            API_BASE_URL="${API_BASE_URL_VARIABLE:-}"
          fi

          if [ -z "$API_BASE_URL" ]; then
            echo "ERROR: API_BASE_URL is not configured."
            echo ""
            echo "Configure:"
            echo "Repository -> Settings -> Secrets and variables -> Actions"
            echo ""
            echo "Name:"
            echo "API_BASE_URL"
            echo ""
            echo "Expected:"
            echo "https://YOUR-API-HOST/api/v1"
            exit 1
          fi

          case "$API_BASE_URL" in
            http://*|https://*)
              ;;
            *)
              echo "ERROR: API_BASE_URL must start with http:// or https://"
              exit 1
              ;;
          esac

          echo "API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"

          echo "API_BASE_URL configured: yes"

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "Preparing Android project"
          echo "========================================"

          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          else
            echo "ERROR: android/gradlew not found."
            exit 1
          fi

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then

            echo "Original Gradle wrapper configuration:"
            cat android/gradle/wrapper/gradle-wrapper.properties

            echo ""
            echo "Pinning Gradle to 8.14..."

            sed -i \
              's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip#' \
              android/gradle/wrapper/gradle-wrapper.properties

            echo ""
            echo "Fixing Gradle 8.14 SHA-256 checksum..."

            if grep -q '^distributionSha256Sum=' android/gradle/wrapper/gradle-wrapper.properties; then
              sed -i \
                's#^distributionSha256Sum=.*#distributionSha256Sum=61ad310d3c7d3e5da131b76bbf22b5a4c0786e9d892dae8c1658d4b484de3caa#' \
                android/gradle/wrapper/gradle-wrapper.properties
            else
              printf '%s\n' \
                'distributionSha256Sum=61ad310d3c7d3e5da131b76bbf22b5a4c0786e9d892dae8c1658d4b484de3caa' \
                >> android/gradle/wrapper/gradle-wrapper.properties
            fi

            echo ""
            echo "Final Gradle wrapper configuration:"
            cat android/gradle/wrapper/gradle-wrapper.properties

            echo ""
            echo "Checking Gradle wrapper pins..."

            grep -q \
              'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip' \
              android/gradle/wrapper/gradle-wrapper.properties

            grep -q \
              'distributionSha256Sum=61ad310d3c7d3e5da131b76bbf22b5a4c0786e9d892dae8c1658d4b484de3caa' \
              android/gradle/wrapper/gradle-wrapper.properties

            echo "Gradle 8.14 wrapper + checksum verified."

          else
            echo "ERROR: gradle-wrapper.properties not found."
            exit 1
          fi

          echo ""
          echo "Running Flutter clean..."
          flutter clean

          echo ""
          echo "Running Flutter pub get..."
          flutter pub get

      - name: Verify application configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "HOPE BUILD CONFIGURATION"
          echo "========================================"
          echo "BUILD_PROFILE=$BUILD_PROFILE"
          echo "Flutter=3.47.0"
          echo "Java=17"
          echo "Gradle=8.14"
          echo "API_BASE_URL configured=yes"
          echo "========================================"

          test -f pubspec.yaml
          test -d android
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter analyzer
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Running Flutter analyzer..."

          flutter analyze

      - name: Verify Gradle wrapper integrity
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "GRADLE WRAPPER INTEGRITY CHECK"
          echo "========================================"

          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep "distributionSha256Sum" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Gradle wrapper configuration is valid."

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "HOPE Android APK Build"
          echo "========================================"
          echo "BUILD_PROFILE=$BUILD_PROFILE"
          echo "Flutter=3.47.0"
          echo "Java=17"
          echo "Gradle=8.14"
          echo "API_BASE_URL configured=yes"
          echo "========================================"

          echo ""
          echo "Building directly with Flutter."
          echo "Skipping tools/build_apk_release.sh CI toolchain guard."

          flutter build apk \
            --release \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="BUILD_PROFILE=$BUILD_PROFILE"

          echo ""
          echo "========================================"
          echo "Flutter APK build finished."
          echo "========================================"

      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Searching for generated APK..."

          APK="$(find build/app/outputs -type f -name '*.apk' -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            echo ""
            echo "APK output directory:"
            find build/app/outputs -maxdepth 6 -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp "$APK" \
            "$GITHUB_WORKSPACE/artifacts/HOPE-pilot-release.apk"

          echo "========================================"
          echo "APK FOUND"
          echo "========================================"

          ls -lh "$GITHUB_WORKSPACE/artifacts/HOPE-pilot-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-pilot-APK
          path: artifacts/HOPE-pilot-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        shell: bash
        run: |
          echo "========================================"
          echo "HOPE BUILD COMPLETED"
          echo "========================================"
          echo "Profile: $BUILD_PROFILE"
          echo "Flutter: 3.47.0"
          echo "Java: 17"
          echo "Gradle: 8.14"
          echo "API_BASE_URL: configured"
          echo ""
          echo "Generated artifacts:"
          ls -lh artifacts/
          echo "========================================"
