name: HOPE ZIP Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hope-zip-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: HOPE ZIP Auto Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BUILD_PROFILE: pilot
      CI_ZIP_BUILD: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate HOPE ZIP
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE=""

          for file in HOPE-*.zip; do
            if [ -f "$file" ]; then
              ARCHIVE="$file"
              break
            fi
          done

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: HOPE ZIP not found."
            exit 1
          fi

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "Using archive: $ARCHIVE"

      - name: Extract HOPE project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .hope-work
          mkdir -p .hope-work/source

          unzip -q "${{ steps.locate.outputs.archive }}" -d .hope-work/source

          echo "Searching for Flutter project..."

          PROJECT_DIR="$(find .hope-work/source -type f -name pubspec.yaml -print -quit | xargs dirname)"

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: Flutter project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project:"
          echo "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          flutter --version
          dart --version
          java -version

      - name: Configure API_BASE_URL
        shell: bash
        env:
          API_BASE_URL_SECRET: ${{ secrets.API_BASE_URL }}
          API_BASE_URL_VARIABLE: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail

          API_BASE_URL="${API_BASE_URL_SECRET:-}"

          if [ -z "$API_BASE_URL" ]; then
            API_BASE_URL="${API_BASE_URL_VARIABLE:-}"
          fi

          if [ -z "$API_BASE_URL" ]; then
            echo "ERROR: API_BASE_URL is not configured."
            exit 1
          fi

          case "$API_BASE_URL" in
            http://*|https://*)
              ;;
            *)
              echo "ERROR: API_BASE_URL must start with http:// or https://"
              exit 1
              ;;
          esac

          echo "API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"

          echo "API_BASE_URL configured: yes"

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x android/gradlew

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i \
              's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip#' \
              android/gradle/wrapper/gradle-wrapper.properties
          fi

          flutter clean
          flutter pub get

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "HOPE Android APK Build"
          echo "BUILD_PROFILE=$BUILD_PROFILE"
          echo "Flutter=3.47.0"
          echo "API_BASE_URL configured=yes"
          echo "========================================"

          if [ -f tools/build_apk_release.sh ]; then
            chmod +x tools/build_apk_release.sh

            API_BASE_URL="$API_BASE_URL" \
            BUILD_PROFILE="$BUILD_PROFILE" \
            CI_ZIP_BUILD="$CI_ZIP_BUILD" \
            ./tools/build_apk_release.sh
          else
            flutter build apk \
              --release \
              --dart-define="API_BASE_URL=$API_BASE_URL" \
              --dart-define="BUILD_PROFILE=$BUILD_PROFILE"
          fi

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK="$(find build/app/outputs -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp "$APK" \
            "$GITHUB_WORKSPACE/artifacts/HOPE-pilot-release.apk"

          echo "APK:"
          ls -lh "$GITHUB_WORKSPACE/artifacts/HOPE-pilot-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-pilot-APK
          path: artifacts/HOPE-pilot-release.apk
          if-no-files-found: error
          retention-days: 14
