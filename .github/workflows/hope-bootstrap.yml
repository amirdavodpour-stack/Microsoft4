name: HOPE Bootstrap

on:
  workflow_dispatch:
    inputs:
      archive:
        description: "ZIP archive filename. Leave empty to auto-detect."
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: hope-bootstrap-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: HOPE Auto Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect ZIP
        id: archive
        shell: bash
        env:
          INPUT_ARCHIVE: ${{ inputs.archive }}
        run: |
          set -euo pipefail

          ARCHIVE="$INPUT_ARCHIVE"

          if test -n "$ARCHIVE"; then
            if test ! -f "$ARCHIVE"; then
              echo "ERROR: ZIP not found:"
              echo "$ARCHIVE"
              exit 1
            fi
          else
            ARCHIVE="$(find . \
              -type f \
              -iname '*.zip' \
              ! -path './.git/*' \
              -print \
              | sort \
              | head -n 1)"

            if test -z "$ARCHIVE"; then
              echo "ERROR: No ZIP archive found."
              exit 1
            fi
          fi

          ARCHIVE="${ARCHIVE#./}"

          echo "Using ZIP:"
          echo "$ARCHIVE"

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .hope-work
          mkdir -p .hope-work/source

      - name: Extract ZIP
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail

          unzip -q "$ARCHIVE" -d ".hope-work/source"

          echo "ZIP extracted successfully."

      - name: Locate Flutter project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE=".hope-work/source"
          PROJECT=""

          if test -f "$SOURCE/pubspec.yaml"; then
            PROJECT="$SOURCE"
          else
            PUBSPEC="$(find "$SOURCE" \
              -type f \
              -name 'pubspec.yaml' \
              ! -path '*/.dart_tool/*' \
              -print \
              | sort \
              | head -n 1)"

            if test -n "$PUBSPEC"; then
              PROJECT="$(dirname "$PUBSPEC")"
            fi
          fi

          if test -z "$PROJECT"; then
            echo "ERROR: Flutter project not found."
            find "$SOURCE" -maxdepth 4 -type f | sort | head -300
            exit 1
          fi

          echo "Flutter project:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          set -euo pipefail

          flutter --version
          dart --version
          java -version

      - name: Get dependencies
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT"

          flutter pub get

      - name: Apply safe Dart fixes
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT"

          dart fix --apply || true
          dart format lib test integration_test || true

      - name: Configure Android compatibility
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          ANDROID="$PROJECT/android"

          if test ! -d "$ANDROID"; then
            echo "ERROR: Android directory not found:"
            echo "$ANDROID"
            exit 1
          fi

          GRADLE_PROPERTIES="$ANDROID/gradle.properties"
          WRAPPER_PROPERTIES="$ANDROID/gradle/wrapper/gradle-wrapper.properties"

          touch "$GRADLE_PROPERTIES"

          echo "Configuring AGP 9 compatibility flags..."

          if grep -q '^android.newDsl=' "$GRADLE_PROPERTIES"; then
            sed -i 's/^android.newDsl=.*/android.newDsl=false/' "$GRADLE_PROPERTIES"
          else
            printf '\nandroid.newDsl=false\n' >> "$GRADLE_PROPERTIES"
          fi

          if grep -q '^android.builtInKotlin=' "$GRADLE_PROPERTIES"; then
            sed -i 's/^android.builtInKotlin=.*/android.builtInKotlin=false/' "$GRADLE_PROPERTIES"
          else
            printf 'android.builtInKotlin=false\n' >> "$GRADLE_PROPERTIES"
          fi

          echo
          echo "gradle.properties:"
          cat "$GRADLE_PROPERTIES"

          if test -f "$WRAPPER_PROPERTIES"; then

            echo
            echo "Current Gradle wrapper:"
            grep '^distributionUrl=' "$WRAPPER_PROPERTIES" || true

            sed -i \
              -E 's#gradle-[0-9]+\.[0-9]+(\.[0-9]+)?-#gradle-8.14-#' \
              "$WRAPPER_PROPERTIES"

            echo
            echo "Updated Gradle wrapper:"
            grep '^distributionUrl=' "$WRAPPER_PROPERTIES" || true

          else
            echo "ERROR: Gradle wrapper properties not found:"
            echo "$WRAPPER_PROPERTIES"
            exit 1
          fi

      - name: Verify Gradle version
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT/android"

          chmod +x ./gradlew

          ./gradlew --version

      - name: Run Flutter analyzer
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -u

          cd "$PROJECT"

          echo "Running Flutter analyzer..."

          flutter analyze \
            > ../flutter-analyze.log 2>&1

          STATUS=$?

          cat ../flutter-analyze.log

          if test "$STATUS" -ne 0; then
            echo
            echo "Analyzer found issues."
            echo "Build will still be attempted so compiler errors can be identified."
          fi

          exit 0

      - name: Build release APK
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT"

          flutter clean
          flutter pub get

          flutter build apk --release

      - name: Locate generated APK
        id: apk
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT/build/app/outputs" \
            -type f \
            -name '*.apk' \
            -print \
            | sort \
            | head -n 1)"

          if test -z "$APK"; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "Generated APK:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-release-apk
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK
        env:
          APK: ${{ steps.apk.outputs.apk }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p releases

          cp "$APK" "releases/HOPE-release.apk"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add releases/HOPE-release.apk

          if git diff --cached --quiet; then
            echo "No APK repository update required."
          else
            git commit -m "build: publish HOPE APK"
            git push
          fi

      - name: Final summary
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "HOPE BOOTSTRAP FINISHED"
          echo "========================================"
          echo
          echo "Artifact: HOPE-release-apk"
          echo "Repository file: releases/HOPE-release.apk"
          echo
