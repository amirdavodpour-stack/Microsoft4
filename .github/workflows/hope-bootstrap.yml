name: HOPE ZIP Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hope-bootstrap-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_ZIP: HOPE-3_8_0-GITHUB-ZIP-AUTO-BUILD-READY-V5-SELF-HEALING.zip
  FLUTTER_VERSION: '3.47.0'
  BUILD_PROFILE: pilot
  API_BASE_URL: ${{ secrets.API_BASE_URL || vars.API_BASE_URL }}
  GRADLE_VERSION: '8.14.3'
  GRADLE_SHA256: bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531

jobs:
  build:
    name: HOPE APK Self-Healing Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          test -f "$SOURCE_ZIP" || {
            echo "ERROR: Required source ZIP not found: $SOURCE_ZIP"
            echo "ZIP files currently in repository:"
            find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort || true
            exit 1
          }

          echo "Using source ZIP: $SOURCE_ZIP"
          ls -lh "$SOURCE_ZIP"
          echo "Source SHA256:"
          sha256sum "$SOURCE_ZIP"

      - name: Extract source project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .hope-work .hope-project
          mkdir -p .hope-work/source

          unzip -q "$SOURCE_ZIP" -d .hope-work/source

          PROJECT_DIR="$(
            find .hope-work/source \
              -type f \
              -name pubspec.yaml \
              -print \
              -quit \
            | xargs -r dirname
          )"

          test -n "$PROJECT_DIR" || {
            echo "ERROR: No Flutter project found inside source ZIP."
            exit 1
          }

          mkdir -p .hope-project
          cp -a "$PROJECT_DIR"/. .hope-project/

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project extracted to:"
          echo "$GITHUB_WORKSPACE/.hope-project"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify toolchain and required configuration
        shell: bash
        run: |
          set -euo pipefail

          flutter --version
          dart --version
          java -version

          test -n "${API_BASE_URL:-}" || {
            echo "ERROR: API_BASE_URL is not configured."
            echo "Create GitHub Actions secret or repository variable: API_BASE_URL"
            exit 1
          }

          case "$API_BASE_URL" in
            https://*) ;;
            *)
              echo "ERROR: API_BASE_URL must use HTTPS."
              exit 1
              ;;
          esac

      - name: Preflight repairs before build
        shell: bash
        run: |
          set -euo pipefail

          cd .hope-project

          echo "========================================"
          echo "PRE-BUILD REPAIR"
          echo "========================================"

          test -f android/gradle/wrapper/gradle-wrapper.properties || {
            echo "ERROR: Gradle wrapper properties missing."
            exit 1
          }

          sed -i \
            "s#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip#" \
            android/gradle/wrapper/gradle-wrapper.properties

          if grep -q '^distributionSha256Sum=' \
            android/gradle/wrapper/gradle-wrapper.properties; then

            sed -i \
              "s#^distributionSha256Sum=.*#distributionSha256Sum=${GRADLE_SHA256}#" \
              android/gradle/wrapper/gradle-wrapper.properties
          else
            printf '\ndistributionSha256Sum=%s\n' \
              "$GRADLE_SHA256" \
              >> android/gradle/wrapper/gradle-wrapper.properties
          fi

          chmod +x android/gradlew

          flutter clean
          flutter pub get

          if [ -f l10n.yaml ]; then
            flutter gen-l10n
          fi

          if [ -x tools/github/self_heal_build.sh ]; then
            bash tools/github/self_heal_build.sh preflight.log || true
          fi

          dart fix --apply || true

          dart format \
            lib \
            test \
            integration_test \
            2>/dev/null || true

          echo "========================================"
          echo "TOOLCHAIN ALIGNMENT"
          echo "========================================"

          if [ -f tools/verify_toolchain_alignment.py ]; then
            python3 tools/verify_toolchain_alignment.py
          fi

          echo "========================================"
          echo "GRADLE WRAPPER"
          echo "========================================"

          grep '^distributionUrl' \
            android/gradle/wrapper/gradle-wrapper.properties

          grep '^distributionSha256Sum' \
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK with self-healing retries
        shell: bash
        run: |
          set -u

          cd .hope-project
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          MAX_ATTEMPTS=3
          BUILD_OK=0

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do

            echo ""
            echo "========================================"
            echo "HOPE BUILD ATTEMPT $attempt / $MAX_ATTEMPTS"
            echo "========================================"

            rm -rf build/app/outputs/flutter-apk/*.apk 2>/dev/null || true

            flutter clean || true
            flutter pub get --enforce-lockfile || flutter pub get || true

            if [ -f l10n.yaml ]; then
              flutter gen-l10n || true
            fi

            if [ -x tools/github/self_heal_build.sh ]; then
              bash tools/github/self_heal_build.sh \
                "attempt-${attempt}-prebuild.log" \
                || true
            fi

            set +e

            API_BASE_URL="$API_BASE_URL" \
            BUILD_PROFILE="$BUILD_PROFILE" \
            bash tools/build_apk_release.sh \
              2>&1 \
              | tee \
                "$GITHUB_WORKSPACE/artifacts/build-attempt-${attempt}.log"

            rc=${PIPESTATUS[0]}

            set -e

            if [ "$rc" -eq 0 ] && \
              find build/app/outputs/flutter-apk \
                -maxdepth 1 \
                -type f \
                -name '*.apk' \
                -print \
                -quit \
              | grep -q .; then

              BUILD_OK=1

              echo ""
              echo "BUILD SUCCESS on attempt $attempt"

              break
            fi

            echo ""
            echo "BUILD FAILED on attempt $attempt"
            echo "Exit code: $rc"

            echo "Running self-healing repair..."

            if [ -x tools/github/self_heal_build.sh ]; then
              bash tools/github/self_heal_build.sh \
                "attempt-${attempt}-repair.log" \
                || true
            fi

            dart fix --apply || true

            dart format \
              lib \
              test \
              integration_test \
              2>/dev/null || true
          done

          if [ "$BUILD_OK" -ne 1 ]; then

            echo ""
            echo "========================================"
            echo "APK BUILD FAILED"
            echo "========================================"

            flutter analyze \
              2>&1 \
              | tee \
                "$GITHUB_WORKSPACE/artifacts/final-analyze.log" \
              || true

            exit 1
          fi

          APK="$(
            find build/app/outputs/flutter-apk \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          test -n "$APK"
          test -s "$APK"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0-pilot.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0-pilot.apk" \
            | tee \
              "$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0-pilot.apk.sha256"

          echo ""
          echo "APK CREATED:"
          ls -lh \
            "$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0-pilot.apk"

      - name: Verify APK artifact
        shell: bash
        run: |
          set -euo pipefail

          test -s artifacts/HOPE-3.8.0-pilot.apk

          file \
            artifacts/HOPE-3.8.0-pilot.apk \
            || true

          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify \
              --verbose \
              artifacts/HOPE-3.8.0-pilot.apk
          fi

      - name: Create successful project ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            .hope-project/.dart_tool \
            .hope-project/build \
            .hope-project/node_modules \
            .hope-project/.gradle \
            .hope-project/.git

          find .hope-project \
            -type f \
            \( \
              -name '*.apk' \
              -o -name '*.aab' \
              -o -name '*.jks' \
              -o -name '*.keystore' \
              -o -name '.env' \
              -o -name 'key.properties' \
            \) \
            -delete

          cd .hope-project

          zip -qr \
            "$GITHUB_WORKSPACE/artifacts/HOPE-3_8_0-SUCCESSFUL-PROJECT.zip" \
            .

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            artifacts/HOPE-3_8_0-SUCCESSFUL-PROJECT.zip \
            | tee \
              artifacts/HOPE-3_8_0-SUCCESSFUL-PROJECT.zip.sha256

          ls -lh \
            artifacts/HOPE-3_8_0-SUCCESSFUL-PROJECT.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-3.8.0-APK
          path: |
            artifacts/HOPE-3.8.0-pilot.apk
            artifacts/HOPE-3.8.0-pilot.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload successful project
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-3.8.0-SUCCESSFUL-PROJECT
          path: |
            artifacts/HOPE-3_8_0-SUCCESSFUL-PROJECT.zip
            artifacts/HOPE-3_8_0-SUCCESSFUL-PROJECT.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-3.8.0-BUILD-DIAGNOSTICS
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Final summary
        shell: bash
        run: |
          echo "========================================"
          echo "HOPE APK BUILD COMPLETED"
          echo "========================================"

          ls -lh \
            artifacts/HOPE-3.8.0-pilot.apk

          ls -lh \
            artifacts/HOPE-3_8_0-SUCCESSFUL-PROJECT.zip

          echo ""
          echo "APK uploaded successfully."
          echo "Successful project ZIP uploaded successfully."
