name: HOPE ZIP Bootstrap

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "hope-bootstrap-${{ github.ref }}"
  cancel-in-progress: false

env:
  SOURCE_ZIP: "HOPE-3_8_0-GITHUB-ZIP-AUTO-BUILD-READY-V5-SELF-HEALING.zip"
  FLUTTER_VERSION: "3.47.0"
  BUILD_PROFILE: "pilot"
  GRADLE_VERSION: "8.14.3"
  GRADLE_SHA256: "bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531"

jobs:
  build:
    name: HOPE APK Self-Healing Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # VERIFY SOURCE ZIP
      # ============================================================

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Required source ZIP not found:"
            echo "$SOURCE_ZIP"
            echo
            echo "ZIP files currently in repository:"
            find . \
              -type f \
              -name "*.zip" \
              -print \
              | sort || true
            exit 1
          fi

          echo "Using source ZIP:"
          echo "$SOURCE_ZIP"

          echo
          echo "ZIP size:"
          ls -lh "$SOURCE_ZIP"

          echo
          echo "ZIP SHA256:"
          sha256sum "$SOURCE_ZIP"

      # ============================================================
      # EXTRACT PROJECT
      # ============================================================

      - name: Extract source project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .hope-work
          rm -rf .hope-project

          mkdir -p .hope-work/source
          mkdir -p .hope-project

          unzip -q "$SOURCE_ZIP" -d .hope-work/source

          echo "Searching for Flutter project..."

          PUBSPEC_PATH="$(
            find .hope-work/source \
              -type f \
              -name "pubspec.yaml" \
              -print \
              -quit
          )"

          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: No pubspec.yaml found inside source ZIP."
            echo
            echo "Extracted files:"
            find .hope-work/source \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -n 300
            exit 1
          fi

          PROJECT_SOURCE_DIR="$(dirname "$PUBSPEC_PATH")"

          echo
          echo "Found Flutter project:"
          echo "$PROJECT_SOURCE_DIR"

          cp -a "$PROJECT_SOURCE_DIR"/. .hope-project/

          test -f ".hope-project/pubspec.yaml"

          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/.hope-project" \
            >> "$GITHUB_ENV"

          echo
          echo "Project copied to:"
          echo "$GITHUB_WORKSPACE/.hope-project"

      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      # ============================================================
      # TOOLCHAIN + API
      # ============================================================

      - name: Verify toolchain and API configuration
        shell: bash
        env:
          API_BASE_URL_SECRET: ${{ secrets.API_BASE_URL }}
          API_BASE_URL_VARIABLE: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FLUTTER"
          echo "========================================"

          flutter --version

          echo
          echo "========================================"
          echo "DART"
          echo "========================================"

          dart --version

          echo
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo
          echo "========================================"
          echo "API CONFIGURATION"
          echo "========================================"

          API_VALUE="${API_BASE_URL_SECRET:-}"

          if [ -z "$API_VALUE" ]; then
            API_VALUE="${API_BASE_URL_VARIABLE:-}"
          fi

          if [ -z "$API_VALUE" ]; then
            echo "ERROR: API_BASE_URL is not configured."
            echo
            echo "Create a GitHub Actions Repository Secret or Variable:"
            echo "API_BASE_URL"
            exit 1
          fi

          case "$API_VALUE" in
            https://*)
              ;;
            *)
              echo "ERROR: API_BASE_URL must use HTTPS."
              exit 1
              ;;
          esac

          {
            echo "API_BASE_URL=$API_VALUE"
            echo "BUILD_PROFILE=$BUILD_PROFILE"
          } >> "$GITHUB_ENV"

          echo "API_BASE_URL configuration verified."

      # ============================================================
      # PREFLIGHT
      # ============================================================

      - name: Preflight project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          pwd

          test -f pubspec.yaml
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo
          echo "========================================"
          echo "GRADLE WRAPPER"
          echo "========================================"

          sed -i \
            "s#^distributionUrl=.*#distributionUrl=https\\\\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip#" \
            android/gradle/wrapper/gradle-wrapper.properties

          if grep -q "^distributionSha256Sum=" \
            android/gradle/wrapper/gradle-wrapper.properties; then

            sed -i \
              "s#^distributionSha256Sum=.*#distributionSha256Sum=${GRADLE_SHA256}#" \
              android/gradle/wrapper/gradle-wrapper.properties

          else

            printf "\ndistributionSha256Sum=%s\n" \
              "$GRADLE_SHA256" \
              >> android/gradle/wrapper/gradle-wrapper.properties

          fi

          chmod +x android/gradlew

          echo
          grep "^distributionUrl=" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep "^distributionSha256Sum=" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo
          echo "========================================"
          echo "FLUTTER CLEAN"
          echo "========================================"

          flutter clean

          echo
          echo "========================================"
          echo "FLUTTER PUB GET"
          echo "========================================"

          flutter pub get

          if [ -f "l10n.yaml" ]; then

            echo
            echo "========================================"
            echo "GENERATE LOCALIZATION"
            echo "========================================"

            flutter gen-l10n

          fi

          echo
          echo "========================================"
          echo "TOOLCHAIN ALIGNMENT"
          echo "========================================"

          if [ -f "tools/verify_toolchain_alignment.py" ]; then
            python3 tools/verify_toolchain_alignment.py
          else
            echo "Toolchain alignment script not present; continuing."
          fi

      # ============================================================
      # APK BUILD
      #
      # IMPORTANT:
      # The previous workflow retried inside the same project tree
      # and reused Gradle/Flutter watcher state.
      #
      # This version creates a completely isolated project + Gradle
      # environment for every attempt and disables Gradle VFS
      # watching/daemon persistence.
      # ============================================================

      - name: Build APK with isolated retries
        shell: bash
        run: |
          set -u

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          BUILD_OK=0

          for ATTEMPT in 1 2 3; do

            echo
            echo "========================================"
            echo "HOPE APK BUILD ATTEMPT $ATTEMPT / 3"
            echo "========================================"
            echo

            ATTEMPT_ROOT="$GITHUB_WORKSPACE/.hope-attempt-$ATTEMPT"
            ATTEMPT_GRADLE_HOME="$GITHUB_WORKSPACE/.gradle-attempt-$ATTEMPT"
            ATTEMPT_LOG="$GITHUB_WORKSPACE/artifacts/build-attempt-${ATTEMPT}.log"

            rm -rf "$ATTEMPT_ROOT"
            rm -rf "$ATTEMPT_GRADLE_HOME"

            mkdir -p "$ATTEMPT_ROOT"
            mkdir -p "$ATTEMPT_GRADLE_HOME"

            echo "Creating isolated project tree..."

            cp -a "$PROJECT_ROOT"/. "$ATTEMPT_ROOT"/

            cd "$ATTEMPT_ROOT"

            # --------------------------------------------------------
            # ISOLATE GRADLE
            # --------------------------------------------------------

            export GRADLE_USER_HOME="$ATTEMPT_GRADLE_HOME"

            export GRADLE_OPTS="\
            -Dorg.gradle.daemon=false \
            -Dorg.gradle.vfs.watch=false \
            -Dorg.gradle.parallel=false"

            export ORG_GRADLE_PROJECT_org.gradle.daemon=false

            # --------------------------------------------------------
            # REMOVE ALL POSSIBLE OLD BUILD/WATCHER STATE
            # --------------------------------------------------------

            rm -rf \
              ".gradle" \
              "android/.gradle" \
              "build" \
              ".dart_tool"

            # Stop any daemon associated with this wrapper.
            ./android/gradlew --stop \
              >/dev/null 2>&1 || true

            # --------------------------------------------------------
            # FLUTTER DEPENDENCIES
            # --------------------------------------------------------

            echo
            echo "Running flutter pub get..."

            flutter pub get || true

            if [ -f "l10n.yaml" ]; then
              echo
              echo "Generating localization..."
              flutter gen-l10n || true
            fi

            # --------------------------------------------------------
            # BUILD
            # --------------------------------------------------------

            echo
            echo "Starting Flutter APK build..."

            set +e

            flutter build apk \
              --release \
              --dart-define="API_BASE_URL=$API_BASE_URL" \
              --dart-define="BUILD_PROFILE=$BUILD_PROFILE" \
              2>&1 | tee "$ATTEMPT_LOG"

            RC=${PIPESTATUS[0]}

            set -e

            echo
            echo "Flutter build exit code: $RC"

            # --------------------------------------------------------
            # ROBUST APK DISCOVERY
            # --------------------------------------------------------

            APK=""

            if [ -d "build" ]; then
              APK="$(
                find build \
                  -type f \
                  -name "*.apk" \
                  -print \
                  -quit \
                  2>/dev/null || true
              )"
            fi

            if [ -n "$APK" ] && [ -s "$APK" ]; then

              echo
              echo "========================================"
              echo "BUILD SUCCESS"
              echo "========================================"
              echo
              echo "APK found:"
              echo "$APK"

              cp \
                "$APK" \
                "$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0-pilot.apk"

              BUILD_OK=1

              break

            fi

            # --------------------------------------------------------
            # FAILURE DIAGNOSTICS
            # --------------------------------------------------------

            echo
            echo "========================================"
            echo "BUILD FAILED"
            echo "========================================"

            echo "Attempt: $ATTEMPT"
            echo "Exit code: $RC"

            echo
            echo "Searching for Gradle watcher / daemon state..."

            ps aux \
              | grep -Ei \
                "gradle|flutter" \
              | grep -v grep \
              || true

            echo
            echo "Gradle directories:"

            find \
              "$ATTEMPT_GRADLE_HOME" \
              "$ATTEMPT_ROOT/android/.gradle" \
              "$ATTEMPT_ROOT/.gradle" \
              -maxdepth 5 \
              -type f \
              2>/dev/null \
              | head -n 300 \
              || true

            echo
            echo "Stopping Gradle daemons..."

            ./android/gradlew --stop \
              >/dev/null 2>&1 || true

            echo
            echo "Attempt $ATTEMPT finished."

          done

          # ==========================================================
          # FINAL FAILURE
          # ==========================================================

          if [ "$BUILD_OK" -ne 1 ]; then

            echo
            echo "========================================"
            echo "APK BUILD FAILED AFTER 3 ATTEMPTS"
            echo "========================================"

            cd "$PROJECT_ROOT"

            flutter analyze \
              2>&1 \
              | tee \
                "$GITHUB_WORKSPACE/artifacts/final-analyze.log" \
              || true

            exit 1

          fi

          # ==========================================================
          # FINAL APK VALIDATION
          # ==========================================================

          APK="$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0-pilot.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK artifact is empty or missing."
            exit 1
          fi

          echo
          echo "========================================"
          echo "FINAL APK"
          echo "========================================"

          ls -lh "$APK"

          echo
          echo "SHA256:"

          sha256sum "$APK" \
            | tee \
              "$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0-pilot.apk.sha256"

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="artifacts/HOPE-3.8.0-pilot.apk"

          test -s "$APK"

          echo "APK file:"
          ls -lh "$APK"

          echo
          echo "APK type:"

          file "$APK" || true

          if command -v apksigner >/dev/null 2>&1; then

            echo
            echo "Running APK signature verification..."

            apksigner verify \
              --verbose \
              "$APK"

          else

            echo
            echo "apksigner is not available on this runner."

          fi

      # ============================================================
      # CREATE SUCCESSFUL PROJECT ZIP
      # ============================================================

      - name: Create successful project ZIP
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$PROJECT_ROOT"

          echo "Cleaning project before packaging..."

          rm -rf \
            "$PROJECT/.dart_tool" \
            "$PROJECT/build" \
            "$PROJECT/node_modules" \
            "$PROJECT/.gradle" \
            "$PROJECT/android/.gradle" \
            "$PROJECT/.git"

          find "$PROJECT" \
            -type f \
            \( \
              -name "*.apk" \
              -o -name "*.aab" \
              -o -name "*.jks" \
              -o -name "*.keystore" \
              -o -name ".env" \
              -o -name "key.properties" \
            \) \
            -delete

          cd "$PROJECT"

          zip -qr \
            "$GITHUB_WORKSPACE/artifacts/HOPE_3_8_0-SUCCESSFUL-PROJECT.zip" \
            .

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            "artifacts/HOPE_3_8_0-SUCCESSFUL-PROJECT.zip" \
            | tee \
              "artifacts/HOPE_3_8_0-SUCCESSFUL-PROJECT.zip.sha256"

          echo
          echo "Successful project ZIP:"
          ls -lh \
            "artifacts/HOPE_3_8_0-SUCCESSFUL-PROJECT.zip"

      # ============================================================
      # DIAGNOSTICS
      # ============================================================

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          {
            echo "========================================"
            echo "HOPE BUILD DIAGNOSTICS"
            echo "========================================"
            echo
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Ref: $GITHUB_REF"
            echo
          } > \
            "$GITHUB_WORKSPACE/artifacts/workflow-summary.txt"

          flutter doctor -v \
            > "$GITHUB_WORKSPACE/artifacts/flutter-doctor.txt" \
            2>&1 || true

          flutter --version \
            > "$GITHUB_WORKSPACE/artifacts/flutter-version.txt" \
            2>&1 || true

          java -version \
            > "$GITHUB_WORKSPACE/artifacts/java-version.txt" \
            2>&1 || true

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-3.8.0-APK
          path: |
            artifacts/HOPE-3.8.0-pilot.apk
            artifacts/HOPE-3.8.0-pilot.apk.sha256
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # UPLOAD PROJECT
      # ============================================================

      - name: Upload successful project
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-3.8.0-SUCCESSFUL-PROJECT
          path: |
            artifacts/HOPE_3_8_0-SUCCESSFUL-PROJECT.zip
            artifacts/HOPE_3_8_0-SUCCESSFUL-PROJECT.zip.sha256
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # UPLOAD DIAGNOSTICS
      # ============================================================

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-3.8.0-BUILD-DIAGNOSTICS
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: Final summary
        if: always()
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "HOPE BUILD FINISHED"
          echo "========================================"

          if [ -f "artifacts/HOPE-3.8.0-pilot.apk" ]; then
            echo "APK: SUCCESS"
            ls -lh "artifacts/HOPE-3.8.0-pilot.apk"
          else
            echo "APK: NOT CREATED"
          fi

          if [ -f "artifacts/HOPE_3_8_0-SUCCESSFUL-PROJECT.zip" ]; then
            echo "PROJECT ZIP: SUCCESS"
            ls -lh "artifacts/HOPE_3_8_0-SUCCESSFUL-PROJECT.zip"
          else
            echo "PROJECT ZIP: NOT CREATED"
          fi
