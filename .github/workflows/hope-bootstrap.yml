name: HOPE Bootstrap

on:
  workflow_dispatch:
    inputs:
      archive:
        description: "ZIP archive filename. Leave empty to auto-detect."
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: hope-bootstrap-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: HOPE Auto Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect ZIP
        id: archive
        shell: bash
        env:
          INPUT_ARCHIVE: ${{ inputs.archive }}
        run: |
          set -euo pipefail

          ARCHIVE="$INPUT_ARCHIVE"

          if test -n "$ARCHIVE"; then
            test -f "$ARCHIVE" || {
              echo "ERROR: ZIP not found:"
              echo "$ARCHIVE"
              exit 1
            }
          else
            ARCHIVE="$(find . \
              -type f \
              -iname '*.zip' \
              ! -path './.git/*' \
              -print \
              | sort \
              | head -n 1)"

            if test -z "$ARCHIVE"; then
              echo "ERROR: No ZIP archive found."
              exit 1
            fi
          fi

          ARCHIVE="${ARCHIVE#./}"

          echo "Using archive:"
          echo "$ARCHIVE"

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .hope-work

          mkdir -p .hope-work/source

      - name: Extract ZIP
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail

          unzip -q "$ARCHIVE" -d ".hope-work/source"

          echo "ZIP extracted."

      - name: Locate Flutter project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE=".hope-work/source"
          PROJECT=""

          if test -f "$SOURCE/pubspec.yaml"; then
            PROJECT="$SOURCE"
          else
            PUBSPEC="$(find "$SOURCE" \
              -type f \
              -name 'pubspec.yaml' \
              ! -path '*/.dart_tool/*' \
              -print \
              | sort \
              | head -n 1)"

            if test -n "$PUBSPEC"; then
              PROJECT="$(dirname "$PUBSPEC")"
            fi
          fi

          if test -z "$PROJECT"; then
            echo "ERROR: Flutter project not found."
            find "$SOURCE" -maxdepth 4 -type f | sort | head -300
            exit 1
          fi

          echo "Flutter project:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          flutter --version

      - name: Get dependencies
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT"

          flutter pub get

      - name: Automatic Dart fixes
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT"

          echo "Running dart fix..."

          dart fix --apply || true

          echo "Running dart format..."

          dart format . || true

      - name: Analyze project
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT"

          echo "Running Flutter analyzer..."

          flutter analyze > ../analyze.log 2>&1 || true

          cat ../analyze.log

          echo
          echo "Analyzer completed."
          echo "Warnings and infos do not stop this workflow."

      - name: Check Dart syntax
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT"

          echo "Checking Dart files..."

          dart analyze lib test integration_test \
            > ../dart-syntax.log 2>&1 || true

          cat ../dart-syntax.log

      - name: Build release APK
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT"

          flutter build apk --release

      - name: Find generated APK
        id: apk
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT/build/app/outputs" \
            -type f \
            -name '*.apk' \
            -print \
            | sort \
            | head -n 1)"

          if test -z "$APK"; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-release-apk
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to repository
        env:
          APK: ${{ steps.apk.outputs.apk }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p releases

          cp "$APK" "releases/HOPE-release.apk"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add releases/HOPE-release.apk

          if git diff --cached --quiet; then
            echo "No APK repository update required."
          else
            git commit -m "build: publish HOPE APK"
            git push
          fi

      - name: Build summary
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "HOPE BUILD COMPLETED"
          echo "========================================"
          echo
          echo "APK artifact:"
          echo "HOPE-release-apk"
          echo
          echo "Repository APK:"
          echo "releases/HOPE-release.apk"
          echo
