name: HOPE ZIP Bootstrap

on:
  workflow_dispatch:
    inputs:
      archive:
        description: "ZIP filename in repository (leave blank to auto-detect)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hope-zip-bootstrap-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_ZIP: HOPE-3_8_0-GITHUB-ZIP-AUTO-BUILD-READY-V5-SELF-HEALING.zip
  FLUTTER_VERSION: "3.47.0"
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.14.3"
  GRADLE_SHA256: "bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531"
  BUILD_PROFILE: "pilot"

jobs:
  build:
    name: HOPE APK Self-Healing Build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. BASIC ENVIRONMENT
      # ============================================================
      - name: Show runner environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== SYSTEM ==="
          uname -a
          echo

          echo "=== JAVA ==="
          java -version || true
          echo

          echo "=== DISK ==="
          df -h
          echo

          echo "=== MEMORY ==="
          free -h || true

      # ============================================================
      # 3. LOCATE SOURCE ZIP
      # ============================================================
      - name: Locate source ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          REQUESTED="${{ inputs.archive }}"

          if [[ -n "$REQUESTED" ]]; then
            if [[ ! -f "$REQUESTED" ]]; then
              echo "::error::Requested archive does not exist: $REQUESTED"
              exit 1
            fi

            SOURCE="$REQUESTED"
          else
            if [[ -f "$SOURCE_ZIP" ]]; then
              SOURCE="$SOURCE_ZIP"
            else
              SOURCE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1 || true)"
            fi
          fi

          if [[ -z "$SOURCE" || ! -f "$SOURCE" ]]; then
            echo "::error::No source ZIP found."
            echo
            echo "ZIP files found:"
            find . -maxdepth 3 -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "SOURCE_ZIP_PATH=$SOURCE" >> "$GITHUB_ENV"

          echo "Using source ZIP:"
          echo "$SOURCE"

          echo
          echo "ZIP size:"
          du -h "$SOURCE"

      # ============================================================
      # 4. VERIFY ZIP
      # ============================================================
      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$SOURCE_ZIP_PATH"

      # ============================================================
      # 5. INSTALL JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 6. INSTALL FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      # ============================================================
      # 7. VERIFY TOOLCHAIN
      # ============================================================
      - name: Verify Flutter and Java
        shell: bash
        run: |
          set -euxo pipefail

          flutter --version
          flutter doctor -v

          java -version

      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================
      - name: Extract HOPE project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .hope-work .hope-project

          mkdir -p .hope-work
          mkdir -p .hope-project

          unzip -q "$SOURCE_ZIP_PATH" -d .hope-work

          echo "=== EXTRACTED FILES ==="
          find .hope-work -maxdepth 3 -type f | head -200

          # --------------------------------------------------------
          # Detect Flutter project root automatically.
          # --------------------------------------------------------

          PROJECT_ROOT=""

          if [[ -f ".hope-work/pubspec.yaml" ]]; then
            PROJECT_ROOT=".hope-work"
          else
            PROJECT_ROOT="$(find .hope-work -type f -name pubspec.yaml -print -quit | xargs -r dirname)"
          fi

          if [[ -z "$PROJECT_ROOT" || ! -f "$PROJECT_ROOT/pubspec.yaml" ]]; then
            echo "::error::Flutter project root could not be detected."
            exit 1
          fi

          echo "Detected project root:"
          echo "$PROJECT_ROOT"

          cp -a "$PROJECT_ROOT"/. .hope-project/

          echo
          echo "=== PROJECT ROOT ==="
          ls -la .hope-project

          echo
          echo "=== PUBSPEC ==="
          sed -n '1,160p' .hope-project/pubspec.yaml

      # ============================================================
      # 9. VALIDATE FLUTTER PROJECT
      # ============================================================
      - name: Validate Flutter project
        shell: bash
        working-directory: .hope-project
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -d android
          test -d lib

          echo "Flutter project structure OK."

      # ============================================================
      # 10. CONFIGURE API
      # ============================================================
      - name: Configure API_BASE_URL
        shell: bash
        env:
          INPUT_API_BASE_URL: ${{ vars.API_BASE_URL }}
          SECRET_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail

          API_VALUE="${SECRET_API_BASE_URL:-}"

          if [[ -z "$API_VALUE" ]]; then
            API_VALUE="${INPUT_API_BASE_URL:-}"
          fi

          if [[ -z "$API_VALUE" ]]; then
            echo "::error::API_BASE_URL is not configured."
            echo
            echo "Create repository variable or secret:"
            echo "API_BASE_URL=https://your-api.example.com"
            exit 1
          fi

          if [[ "$API_VALUE" != https://* ]]; then
            echo "::error::API_BASE_URL must use HTTPS."
            exit 1
          fi

          {
            echo "API_BASE_URL<<EOF"
            echo "$API_VALUE"
            echo "EOF"
          } >> "$GITHUB_ENV"

          echo "API_BASE_URL configured successfully."

      # ============================================================
      # 11. ALIGN GRADLE WRAPPER
      # ============================================================
      - name: Align Gradle wrapper
        shell: bash
        working-directory: .hope-project
        run: |
          set -euo pipefail

          test -f android/gradle/wrapper/gradle-wrapper.properties

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/gradle/wrapper/gradle-wrapper.properties")

          text = p.read_text()

          version = "8.14.3"

          distribution = (
              "https://services.gradle.org/distributions/"
              f"gradle-{version}-all.zip"
          )

          lines = text.splitlines()
          found = False

          for i, line in enumerate(lines):
              if line.startswith("distributionUrl="):
                  lines[i] = "distributionUrl=" + distribution
                  found = True

          if not found:
              lines.append("distributionUrl=" + distribution)

          p.write_text("\n".join(lines) + "\n")

          print(p.read_text())
          PY

      # ============================================================
      # 12. PREFLIGHT
      # ============================================================
      - name: Preflight Flutter project
        shell: bash
        working-directory: .hope-project
        run: |
          set -euo pipefail

          export GRADLE_USER_HOME="$GITHUB_WORKSPACE/.gradle-preflight"

          export GRADLE_OPTS="\
          -Dorg.gradle.daemon=false \
          -Dorg.gradle.vfs.watch=false \
          -Dorg.gradle.parallel=false \
          -Dorg.gradle.caching=false"

          export ORG_GRADLE_PROJECT_org.gradle.daemon=false
          export ORG_GRADLE_PROJECT_org.gradle.vfs.watch=false

          rm -rf \
            build \
            .dart_tool \
            .gradle \
            android/.gradle \
            android/build

          ./android/gradlew --stop || true

          flutter clean

          flutter pub get

          flutter gen-l10n || true

      # ============================================================
      # 13. BUILD WITH ISOLATED RETRIES
      # ============================================================
      - name: Build APK with isolated self-healing attempts
        shell: bash
        env:
          API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          set -uo pipefail

          MAX_ATTEMPTS=3
          BUILD_SUCCESS=0

          rm -rf artifacts
          mkdir -p artifacts

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do

            echo
            echo "============================================================"
            echo "HOPE BUILD ATTEMPT $ATTEMPT / $MAX_ATTEMPTS"
            echo "============================================================"
            echo

            ATTEMPT_ROOT="$GITHUB_WORKSPACE/.hope-attempt-$ATTEMPT"
            GRADLE_HOME="$GITHUB_WORKSPACE/.gradle-attempt-$ATTEMPT"

            rm -rf "$ATTEMPT_ROOT"
            rm -rf "$GRADLE_HOME"

            mkdir -p "$ATTEMPT_ROOT"
            mkdir -p "$GRADLE_HOME"

            # ------------------------------------------------------
            # CRITICAL:
            # Every attempt receives a completely fresh project tree.
            # ------------------------------------------------------

            cp -a "$GITHUB_WORKSPACE/.hope-project"/. "$ATTEMPT_ROOT"/

            export GRADLE_USER_HOME="$GRADLE_HOME"

            export GRADLE_OPTS="\
            -Dorg.gradle.daemon=false \
            -Dorg.gradle.vfs.watch=false \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.caching=false \
            -Dorg.gradle.configuration-cache=false"

            export ORG_GRADLE_PROJECT_org.gradle.daemon=false
            export ORG_GRADLE_PROJECT_org.gradle.vfs.watch=false

            export FLUTTER_SUPPRESS_ANALYTICS=true

            cd "$ATTEMPT_ROOT"

            echo "Attempt project:"
            pwd

            echo
            echo "Cleaning isolated attempt..."

            rm -rf \
              build \
              .dart_tool \
              .gradle \
              android/.gradle \
              android/build

            ./android/gradlew --stop || true

            echo
            echo "Flutter version:"
            flutter --version

            echo
            echo "Getting packages..."

            if ! flutter pub get; then
              echo "::warning::flutter pub get failed on attempt $ATTEMPT"
              continue
            fi

            echo
            echo "Generating localization..."

            flutter gen-l10n || true

            echo
            echo "Starting APK build..."

            set +e

            flutter build apk \
              --release \
              --dart-define="API_BASE_URL=$API_BASE_URL" \
              --dart-define="BUILD_PROFILE=$BUILD_PROFILE" \
              --no-pub

            BUILD_EXIT=$?

            set -e

            echo
            echo "Flutter build exit code: $BUILD_EXIT"

            if [[ "$BUILD_EXIT" -eq 0 ]]; then

              echo
              echo "Searching for APK..."

              APK_PATH="$(find "$ATTEMPT_ROOT/build" \
                -type f \
                \( -name '*.apk' -o -name '*.aab' \) \
                -print \
                | head -n 1 || true)"

              if [[ -n "$APK_PATH" && -f "$APK_PATH" ]]; then

                echo "APK found:"
                echo "$APK_PATH"

                mkdir -p "$GITHUB_WORKSPACE/artifacts"

                cp "$APK_PATH" \
                  "$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0-pilot.apk"

                if [[ -f "$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0-pilot.apk" ]]; then

                  APK_SIZE="$(stat -c%s \
                    "$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0-pilot.apk")"

                  if [[ "$APK_SIZE" -gt 100000 ]]; then
                    echo
                    echo "APK verification successful."
                    echo "APK size: $APK_SIZE bytes"

                    BUILD_SUCCESS=1
                    break
                  else
                    echo "::warning::APK exists but is suspiciously small."
                  fi
                fi
              else
                echo "::warning::Build succeeded but APK was not found."
              fi
            fi

            echo
            echo "Attempt $ATTEMPT failed."

            echo
            echo "=== LAST BUILD LOG HINTS ==="

            find "$ATTEMPT_ROOT" \
              -type f \
              \( -name '*.log' -o -name '*.txt' \) \
              -print 2>/dev/null \
              | head -30 || true

            echo
            echo "=== MEMORY ==="
            free -h || true

            echo
            echo "=== DISK ==="
            df -h || true

            echo
            echo "Preparing completely fresh retry..."

            ./android/gradlew --stop || true

            cd "$GITHUB_WORKSPACE"

            rm -rf "$ATTEMPT_ROOT"
            rm -rf "$GRADLE_HOME"

            sleep 3

          done

          if [[ "$BUILD_SUCCESS" -ne 1 ]]; then
            echo
            echo "::error::All $MAX_ATTEMPTS isolated build attempts failed."
            exit 1
          fi

          echo
          echo "============================================================"
          echo "HOPE APK BUILD SUCCESSFUL"
          echo "============================================================"

          ls -lh artifacts/

      # ============================================================
      # 14. VERIFY APK
      # ============================================================
      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="artifacts/HOPE-3.8.0-pilot.apk"

          test -f "$APK"

          SIZE="$(stat -c%s "$APK")"

          echo "APK:"
          echo "$APK"

          echo "Size:"
          echo "$SIZE bytes"

          if [[ "$SIZE" -lt 100000 ]]; then
            echo "::error::APK is too small."
            exit 1
          fi

          file "$APK"

          sha256sum "$APK"

      # ============================================================
      # 15. PACKAGE PROJECT
      # ============================================================
      - name: Package built project
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cd .hope-project

          zip -qr \
            "$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0-built-project.zip" \
            . \
            -x ".dart_tool/*" \
            -x ".gradle/*" \
            -x "build/*" \
            -x "android/.gradle/*"

          cd "$GITHUB_WORKSPACE"

          ls -lh artifacts/

      # ============================================================
      # 16. COLLECT DIAGNOSTICS
      # ============================================================
      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p artifacts/diagnostics

          echo "=== RUN INFO ===" \
            > artifacts/diagnostics/run-info.txt

          echo "Repository: $GITHUB_REPOSITORY" \
            >> artifacts/diagnostics/run-info.txt

          echo "Ref: $GITHUB_REF" \
            >> artifacts/diagnostics/run-info.txt

          echo "SHA: $GITHUB_SHA" \
            >> artifacts/diagnostics/run-info.txt

          echo "Flutter: $FLUTTER_VERSION" \
            >> artifacts/diagnostics/run-info.txt

          echo "Gradle: $GRADLE_VERSION" \
            >> artifacts/diagnostics/run-info.txt

          echo
          echo "=== TOOLCHAIN ==="

          flutter --version \
            > artifacts/diagnostics/flutter-version.txt 2>&1

          flutter doctor -v \
            > artifacts/diagnostics/flutter-doctor.txt 2>&1

          java -version \
            > artifacts/diagnostics/java-version.txt 2>&1

          echo
          echo "=== WORKSPACE ==="

          find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            | sort \
            > artifacts/diagnostics/workspace-files.txt

          echo
          echo "=== DISK ==="

          df -h \
            > artifacts/diagnostics/disk.txt 2>&1

          echo
          echo "=== MEMORY ==="

          free -h \
            > artifacts/diagnostics/memory.txt 2>&1

      # ============================================================
      # 17. UPLOAD FINAL ARTIFACTS
      # ============================================================
      - name: Upload HOPE APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-3.8.0-pilot-apk
          path: artifacts/HOPE-3.8.0-pilot.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload built project
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-3.8.0-built-project
          path: artifacts/HOPE-3.8.0-built-project.zip
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 18. UPLOAD DIAGNOSTICS
      # ============================================================
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-build-diagnostics
          path: artifacts/diagnostics
          if-no-files-found: warn
          retention-days: 14
