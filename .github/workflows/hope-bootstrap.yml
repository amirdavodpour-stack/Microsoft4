name: HOPE Bootstrap

on:
  workflow_dispatch:
    inputs:
      archive:
        description: "ZIP archive filename. Leave empty to auto-detect."
        required: false
        type: string

      build_profile:
        description: "HOPE build profile"
        required: false
        type: choice
        default: production
        options:
          - production
          - pilot

permissions:
  contents: write
  actions: write

concurrency:
  group: hope-bootstrap-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: HOPE Auto Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect ZIP
        id: archive
        shell: bash
        env:
          INPUT_ARCHIVE: ${{ inputs.archive }}
        run: |
          set -euo pipefail

          ARCHIVE="$INPUT_ARCHIVE"

          if test -n "$ARCHIVE"; then
            if test ! -f "$ARCHIVE"; then
              echo "ERROR: ZIP not found:"
              echo "$ARCHIVE"
              exit 1
            fi
          else
            ARCHIVE="$(find . \
              -type f \
              -iname '*.zip' \
              ! -path './.git/*' \
              -print \
              | sort \
              | head -n 1)"

            if test -z "$ARCHIVE"; then
              echo "ERROR: No ZIP archive found."
              exit 1
            fi
          fi

          ARCHIVE="${ARCHIVE#./}"

          echo "Using ZIP:"
          echo "$ARCHIVE"

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .hope-work
          mkdir -p .hope-work/source

      - name: Extract ZIP
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail

          unzip -q "$ARCHIVE" -d ".hope-work/source"

          echo "ZIP extracted successfully."

      - name: Locate Flutter project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE=".hope-work/source"
          PROJECT=""

          if test -f "$SOURCE/pubspec.yaml"; then
            PROJECT="$SOURCE"
          else
            PUBSPEC="$(find "$SOURCE" \
              -type f \
              -name 'pubspec.yaml' \
              ! -path '*/.dart_tool/*' \
              -print \
              | sort \
              | head -n 1)"

            if test -n "$PUBSPEC"; then
              PROJECT="$(dirname "$PUBSPEC")"
            fi
          fi

          if test -z "$PROJECT"; then
            echo "ERROR: Flutter project not found."
            find "$SOURCE" -maxdepth 4 -type f | sort | head -300
            exit 1
          fi

          echo "Flutter project:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          set -euo pipefail

          flutter --version
          dart --version
          java -version

      - name: Get dependencies
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT"

          flutter pub get

      - name: Apply safe Dart fixes
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT"

          dart fix --apply || true
          dart format lib test integration_test || true

      - name: Configure Gradle compatibility
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          ANDROID="$PROJECT/android"
          PROPERTIES="$ANDROID/gradle.properties"
          WRAPPER="$ANDROID/gradle/wrapper/gradle-wrapper.properties"

          if test ! -d "$ANDROID"; then
            echo "ERROR: Android directory not found."
            exit 1
          fi

          if test ! -f "$WRAPPER"; then
            echo "ERROR: Gradle wrapper properties not found."
            exit 1
          fi

          touch "$PROPERTIES"

          if grep -q '^android.newDsl=' "$PROPERTIES"; then
            sed -i 's/^android.newDsl=.*/android.newDsl=false/' "$PROPERTIES"
          else
            printf '%s\n' 'android.newDsl=false' >> "$PROPERTIES"
          fi

          if grep -q '^android.builtInKotlin=' "$PROPERTIES"; then
            sed -i 's/^android.builtInKotlin=.*/android.builtInKotlin=false/' "$PROPERTIES"
          else
            printf '%s\n' 'android.builtInKotlin=false' >> "$PROPERTIES"
          fi

          sed -i \
            -E 's#gradle-[0-9]+\.[0-9]+(\.[0-9]+)?-bin\.zip#gradle-8.14-bin.zip#' \
            "$WRAPPER"

          if grep -q '^distributionSha256Sum=' "$WRAPPER"; then
            sed -i \
              's/^distributionSha256Sum=.*/distributionSha256Sum=61ad310d3c7d3e5da131b76bbf22b5a4c0786e9d892dae8c1658d4b484de3caa/' \
              "$WRAPPER"
          else
            printf '%s\n' \
              'distributionSha256Sum=61ad310d3c7d3e5da131b76bbf22b5a4c0786e9d892dae8c1658d4b484de3caa' \
              >> "$WRAPPER"
          fi

          echo
          echo "===== gradle.properties ====="
          cat "$PROPERTIES"

          echo
          echo "===== gradle-wrapper.properties ====="
          cat "$WRAPPER"

      - name: Verify Gradle wrapper
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT/android"

          chmod +x ./gradlew

          ./gradlew --version

      - name: Analyze Dart
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set +e

          cd "$PROJECT"

          flutter analyze

          STATUS=$?

          if test "$STATUS" -ne 0; then
            echo
            echo "WARNING: Analyzer reported issues."
            echo "Build will continue."
          fi

          exit 0

      - name: Build release APK
        env:
          PROJECT: ${{ steps.project.outputs.project }}
          BUILD_PROFILE: ${{ inputs.build_profile }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT"

          echo "BUILD_PROFILE=$BUILD_PROFILE"

          if test "$BUILD_PROFILE" != "production" &&
             test "$BUILD_PROFILE" != "pilot"; then
            echo "ERROR: BUILD_PROFILE must be production or pilot."
            exit 1
          fi

          flutter clean
          flutter pub get

          export BUILD_PROFILE="$BUILD_PROFILE"

          flutter build apk --release

      - name: Locate generated APK
        id: apk
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT/build/app/outputs" \
            -type f \
            -name '*.apk' \
            -print \
            | sort \
            | head -n 1)"

          if test -z "$APK"; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "Generated APK:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-release-apk
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK
        env:
          APK: ${{ steps.apk.outputs.apk }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p releases

          cp "$APK" "releases/HOPE-release.apk"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add releases/HOPE-release.apk

          if git diff --cached --quiet; then
            echo "No repository update required."
          else
            git commit -m "build: publish HOPE APK"
            git push
          fi

      - name: Final summary
        run: |
          echo
          echo "========================================"
          echo "HOPE BUILD PIPELINE FINISHED"
          echo "========================================"
          echo
          echo "Build profile: ${{ inputs.build_profile }}"
          echo "Artifact: HOPE-release-apk"
          echo "APK: releases/HOPE-release.apk"
          echo
