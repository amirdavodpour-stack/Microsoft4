name: HOPE ZIP Bootstrap

on:
  workflow_dispatch:
    inputs:
      archive:
        description: "ZIP filename in repository (leave blank to auto-detect)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: hope-zip-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: HOPE ZIP Auto Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BUILD_PROFILE: pilot
      CI_ZIP_BUILD: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate ZIP archive
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          INPUT_ARCHIVE="${{ inputs.archive }}"

          if [ -n "$INPUT_ARCHIVE" ]; then
            if [ ! -f "$INPUT_ARCHIVE" ]; then
              echo "ERROR: Requested archive does not exist: $INPUT_ARCHIVE"
              exit 1
            fi

            ARCHIVE="$INPUT_ARCHIVE"
          else
            mapfile -t ZIPS < <(find . -maxdepth 2 -type f -name 'HOPE-*.zip' -print)

            if [ "${#ZIPS[@]}" -eq 0 ]; then
              echo "ERROR: No HOPE-*.zip archive found."
              exit 1
            fi

            if [ "${#ZIPS[@]}" -gt 1 ]; then
              echo "Multiple HOPE archives found:"
              printf ' - %s\n' "${ZIPS[@]}"
              echo "Using the first matching archive."
            fi

            ARCHIVE="${ZIPS[0]}"
          fi

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "Using archive: $ARCHIVE"

      - name: Extract HOPE project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .hope-work
          mkdir -p .hope-work/source

          unzip -q "${{ steps.locate.outputs.archive }}" -d .hope-work/source

          echo "Extracted files:"
          find .hope-work/source -maxdepth 3 -type f | head -100

      - name: Locate Flutter project
        id: flutter_project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find .hope-work/source -type f -name pubspec.yaml -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project containing pubspec.yaml was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/android/gradlew" ]; then
            echo "ERROR: Flutter Android project not found at: $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "HOPE TOOLCHAIN"
          echo "========================================"

          flutter --version
          dart --version
          java -version
          echo "Gradle wrapper:"
          cd "$PROJECT_DIR/android"
          ./gradlew --version

      - name: Configure API base URL
        shell: bash
        env:
          API_BASE_URL_SECRET: ${{ secrets.API_BASE_URL }}
          API_BASE_URL_VARIABLE: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail

          API_BASE_URL="${API_BASE_URL_SECRET:-}"

          if [ -z "$API_BASE_URL" ]; then
            API_BASE_URL="${API_BASE_URL_VARIABLE:-}"
          fi

          if [ -z "$API_BASE_URL" ]; then
            echo "ERROR: API_BASE_URL is not configured."
            echo ""
            echo "Configure one of these in:"
            echo "Repository -> Settings -> Secrets and variables -> Actions"
            echo ""
            echo "Option A - Repository secret:"
            echo "API_BASE_URL"
            echo ""
            echo "Option B - Repository variable:"
            echo "API_BASE_URL"
            echo ""
            echo "Expected format:"
            echo "https://YOUR-API-HOST/api/v1"
            exit 1
          fi

          case "$API_BASE_URL" in
            http://*|https://*)
              ;;
            *)
              echo "ERROR: API_BASE_URL must start with http:// or https://"
              exit 1
              ;;
          esac

          echo "API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"

          echo "API_BASE_URL configured: yes"

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "HOPE PROJECT"
          echo "========================================"
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "BUILD_PROFILE=$BUILD_PROFILE"
          echo "API_BASE_URL configured: yes"
          echo "========================================"

          test -f pubspec.yaml
          test -d android
          test -f android/gradlew

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i \
              's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip#' \
              gradle/wrapper/gradle-wrapper.properties
          fi

          echo "Gradle wrapper:"
          grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties || true

      - name: Flutter clean and dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get

      - name: Flutter analyzer
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter analyze

      - name: Build HOPE APK
        shell
