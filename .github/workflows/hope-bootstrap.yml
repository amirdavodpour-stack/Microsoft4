name: HOPE ZIP Bootstrap

on:
  workflow_dispatch:
    inputs:
      archive:
        description: "ZIP filename in repository (leave blank to auto-detect)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hope-zip-bootstrap-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_ZIP: HOPE-3_8_0-GITHUB-ZIP-AUTO-BUILD-READY-V5-SELF-HEALING.zip
  FLUTTER_VERSION: "3.47.0"
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.14.3"
  GRADLE_SHA256: "bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531"
  BUILD_PROFILE: "pilot"

jobs:
  build:
    name: HOPE APK Self-Healing Build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. RUNNER INFORMATION
      # ============================================================
      - name: Show runner environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "HOPE BUILD ENVIRONMENT"
          echo "========================================"

          echo
          echo "=== SYSTEM ==="
          uname -a

          echo
          echo "=== JAVA ==="
          java -version || true

          echo
          echo "=== DISK ==="
          df -h

          echo
          echo "=== MEMORY ==="
          free -h || true

      # ============================================================
      # 3. FIND ZIP
      # ============================================================
      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          REQUESTED="${{ inputs.archive }}"

          if [[ -n "$REQUESTED" ]]; then

            if [[ ! -f "$REQUESTED" ]]; then
              echo "::error::Requested archive does not exist: $REQUESTED"
              exit 1
            fi

            SOURCE="$REQUESTED"

          elif [[ -f "$SOURCE_ZIP" ]]; then

            SOURCE="$SOURCE_ZIP"

          else

            SOURCE="$(find . \
              -maxdepth 3 \
              -type f \
              -iname '*.zip' \
              -print \
              | head -n 1 || true)"

          fi

          if [[ -z "$SOURCE" || ! -f "$SOURCE" ]]; then
            echo "::error::No ZIP archive found."

            echo
            echo "Available ZIP files:"
            find . \
              -maxdepth 4 \
              -type f \
              -iname '*.zip' \
              -print || true

            exit 1
          fi

          echo "SOURCE_ZIP_PATH=$SOURCE" >> "$GITHUB_ENV"

          echo
          echo "Selected source archive:"
          echo "$SOURCE"

          echo
          echo "Archive size:"
          du -h "$SOURCE"

      # ============================================================
      # 4. VERIFY ZIP
      # ============================================================
      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing ZIP integrity..."

          unzip -t "$SOURCE_ZIP_PATH"

          echo
          echo "ZIP integrity OK."

      # ============================================================
      # 5. JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 6. FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      # ============================================================
      # 7. TOOLCHAIN CHECK
      # ============================================================
      - name: Verify Flutter and Java
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== FLUTTER ==="
          flutter --version

          echo
          echo "=== FLUTTER DOCTOR ==="
          flutter doctor -v

          echo
          echo "=== JAVA ==="
          java -version

      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================
      - name: Extract HOPE project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .hope-work
          rm -rf .hope-project

          mkdir -p .hope-work
          mkdir -p .hope-project

          echo "Extracting source ZIP..."

          unzip -q "$SOURCE_ZIP_PATH" -d .hope-work

          echo
          echo "=== EXTRACTED CONTENT ==="

          find .hope-work \
            -maxdepth 4 \
            -type f \
            -print \
            | head -300

          echo
          echo "Detecting Flutter project..."

          PROJECT_ROOT=""

          if [[ -f ".hope-work/pubspec.yaml" ]]; then
            PROJECT_ROOT=".hope-work"
          else
            PROJECT_ROOT="$(
              find .hope-work \
                -type f \
                -name "pubspec.yaml" \
                -print \
                -quit \
                | xargs -r dirname
            )"
          fi

          if [[ -z "$PROJECT_ROOT" ]]; then
            echo "::error::pubspec.yaml was not found."
            exit 1
          fi

          if [[ ! -f "$PROJECT_ROOT/pubspec.yaml" ]]; then
            echo "::error::Invalid Flutter project root."
            exit 1
          fi

          echo
          echo "Flutter project root:"
          echo "$PROJECT_ROOT"

          cp -a "$PROJECT_ROOT"/. .hope-project/

          echo
          echo "=== PROJECT ROOT ==="
          ls -la .hope-project

          echo
          echo "=== PUBSPEC ==="
          sed -n '1,200p' .hope-project/pubspec.yaml

      # ============================================================
      # 9. PROJECT VALIDATION
      # ============================================================
      - name: Validate Flutter project
        shell: bash
        working-directory: .hope-project
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -d android
          test -d lib

          echo "Flutter project structure is valid."

      # ============================================================
      # 10. API CONFIGURATION
      # ============================================================
      - name: Configure API_BASE_URL
        shell: bash
        env:
          INPUT_API_BASE_URL: ${{ vars.API_BASE_URL }}
          SECRET_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail

          API_VALUE="${SECRET_API_BASE_URL:-}"

          if [[ -z "$API_VALUE" ]]; then
            API_VALUE="${INPUT_API_BASE_URL:-}"
          fi

          if [[ -z "$API_VALUE" ]]; then
            echo "::error::API_BASE_URL is not configured."
            echo
            echo "Configure repository variable or secret:"
            echo "API_BASE_URL"
            exit 1
          fi

          if [[ "$API_VALUE" != https://* ]]; then
            echo "::error::API_BASE_URL must start with https://"
            exit 1
          fi

          {
            echo "API_BASE_URL<<EOF"
            echo "$API_VALUE"
            echo "EOF"
          } >> "$GITHUB_ENV"

          echo "API_BASE_URL configured."

      # ============================================================
      # 11. GRADLE WRAPPER
      # ============================================================
      - name: Align Gradle wrapper
        shell: bash
        working-directory: .hope-project
        run: |
          set -euo pipefail

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [[ ! -f "$WRAPPER" ]]; then
            echo "::error::Gradle wrapper properties not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/gradle/wrapper/gradle-wrapper.properties")

          version = "8.14.3"

          distribution_url = (
              "https://services.gradle.org/distributions/"
              f"gradle-{version}-all.zip"
          )

          lines = path.read_text().splitlines()

          replaced = False

          for i, line in enumerate(lines):
              if line.startswith("distributionUrl="):
                  lines[i] = "distributionUrl=" + distribution_url
                  replaced = True

          if not replaced:
              lines.append("distributionUrl=" + distribution_url)

          path.write_text("\n".join(lines) + "\n")

          print("=== FINAL GRADLE WRAPPER ===")
          print(path.read_text())
          PY

      # ============================================================
      # 12. PREFLIGHT
      # ============================================================
      - name: Preflight Flutter project
        shell: bash
        working-directory: .hope-project
        run: |
          set -euo pipefail

          export GRADLE_USER_HOME="$GITHUB_WORKSPACE/.gradle-preflight"

          export GRADLE_OPTS="\
          -Dorg.gradle.daemon=false \
          -Dorg.gradle.vfs.watch=false \
          -Dorg.gradle.parallel=false \
          -Dorg.gradle.caching=false \
          -Dorg.gradle.configuration-cache=false"

          export FLUTTER_SUPPRESS_ANALYTICS=true

          echo "Stopping any Gradle daemons..."

          ./android/gradlew --stop || true

          echo
          echo "Removing generated state..."

          rm -rf build
          rm -rf .dart_tool
          rm -rf .gradle
          rm -rf android/.gradle
          rm -rf android/build

          echo
          echo "Flutter clean..."

          flutter clean

          echo
          echo "Flutter pub get..."

          flutter pub get

          echo
          echo "Generating localization..."

          flutter gen-l10n || true

          echo
          echo "Preflight completed."

      # ============================================================
      # 13. BUILD
      # ============================================================
      - name: Build APK with isolated self-healing attempts
        shell: bash
        env:
          API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          set -uo pipefail

          MAX_ATTEMPTS=3
          BUILD_SUCCESS=0

          rm -rf artifacts
          mkdir -p artifacts

          for ATTEMPT in 1 2 3; do

            echo
            echo "============================================================"
            echo "HOPE BUILD ATTEMPT $ATTEMPT / $MAX_ATTEMPTS"
            echo "============================================================"
            echo

            ATTEMPT_ROOT="$GITHUB_WORKSPACE/.hope-attempt-$ATTEMPT"
            GRADLE_HOME="$GITHUB_WORKSPACE/.gradle-attempt-$ATTEMPT"

            echo "Preparing isolated directories..."

            rm -rf "$ATTEMPT_ROOT"
            rm -rf "$GRADLE_HOME"

            mkdir -p "$ATTEMPT_ROOT"
            mkdir -p "$GRADLE_HOME"

            # ------------------------------------------------------
            # Completely fresh project for every attempt.
            # ------------------------------------------------------

            cp -a \
              "$GITHUB_WORKSPACE/.hope-project"/. \
              "$ATTEMPT_ROOT"/

            export GRADLE_USER_HOME="$GRADLE_HOME"

            export GRADLE_OPTS="\
            -Dorg.gradle.daemon=false \
            -Dorg.gradle.vfs.watch=false \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.caching=false \
            -Dorg.gradle.configuration-cache=false"

            export FLUTTER_SUPPRESS_ANALYTICS=true

            cd "$ATTEMPT_ROOT"

            echo
            echo "Attempt root:"
            pwd

            echo
            echo "Cleaning attempt state..."

            rm -rf build
            rm -rf .dart_tool
            rm -rf .gradle
            rm -rf android/.gradle
            rm -rf android/build

            echo
            echo "Stopping Gradle..."

            ./android/gradlew --stop || true

            echo
            echo "Flutter version:"
            flutter --version

            echo
            echo "Getting packages..."

            if ! flutter pub get; then
              echo "::warning::flutter pub get failed on attempt $ATTEMPT"

              cd "$GITHUB_WORKSPACE"

              rm -rf "$ATTEMPT_ROOT"
              rm -rf "$GRADLE_HOME"

              sleep 3

              continue
            fi

            echo
            echo "Generating localization..."

            flutter gen-l10n || true

            echo
            echo "============================================================"
            echo "STARTING RELEASE APK BUILD"
            echo "============================================================"
            echo

            set +e

            flutter build apk \
              --release \
              --dart-define="API_BASE_URL=$API_BASE_URL" \
              --dart-define="BUILD_PROFILE=$BUILD_PROFILE" \
              --no-pub

            BUILD_EXIT=$?

            set -e

            echo
            echo "Flutter build exit code: $BUILD_EXIT"

            if [[ "$BUILD_EXIT" -eq 0 ]]; then

              echo
              echo "Searching for APK..."

              APK_PATH="$(
                find "$ATTEMPT_ROOT/build" \
                  -type f \
                  -name "*.apk" \
                  -print \
                  2>/dev/null \
                  | head -n 1 || true
              )"

              if [[ -n "$APK_PATH" && -f "$APK_PATH" ]]; then

                echo
                echo "APK FOUND:"
                echo "$APK_PATH"

                mkdir -p "$GITHUB_WORKSPACE/artifacts"

                cp \
                  "$APK_PATH" \
                  "$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0-pilot.apk"

                APK="$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0-pilot.apk"

                if [[ -f "$APK" ]]; then

                  APK_SIZE="$(stat -c%s "$APK")"

                  echo
                  echo "APK SIZE:"
                  echo "$APK_SIZE bytes"

                  if [[ "$APK_SIZE" -gt 100000 ]]; then

                    echo
                    echo "============================================================"
                    echo "HOPE APK BUILD SUCCESSFUL"
                    echo "============================================================"

                    BUILD_SUCCESS=1
                    break

                  else

                    echo "::warning::APK is suspiciously small."

                  fi
                fi

              else

                echo "::warning::Build returned success but no APK was found."

              fi

            fi

            echo
            echo "============================================================"
            echo "ATTEMPT $ATTEMPT FAILED"
            echo "============================================================"
            echo

            echo "Collecting useful diagnostics..."

            echo
            echo "=== DISK ==="
            df -h || true

            echo
            echo "=== MEMORY ==="
            free -h || true

            echo
            echo "=== GRADLE PROCESSES ==="
            ps aux | grep -i gradle | grep -v grep || true

            echo
            echo "=== JAVA PROCESSES ==="
            ps aux | grep -i java | grep -v grep || true

            echo
            echo "Stopping Gradle..."

            ./android/gradlew --stop || true

            cd "$GITHUB_WORKSPACE"

            echo
            echo "Destroying failed attempt..."

            rm -rf "$ATTEMPT_ROOT"
            rm -rf "$GRADLE_HOME"

            echo
            echo "Waiting before next isolated attempt..."

            sleep 5

          done

          if [[ "$BUILD_SUCCESS" -ne 1 ]]; then

            echo
            echo "============================================================"
            echo "HOPE BUILD FAILED"
            echo "============================================================"

            echo "::error::All $MAX_ATTEMPTS isolated build attempts failed."

            exit 1
          fi

          echo
          echo "Final artifacts:"
          ls -lah artifacts/

      # ============================================================
      # 14. FINAL APK VERIFICATION
      # ============================================================
      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="artifacts/HOPE-3.8.0-pilot.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::Final APK does not exist."
            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"

          echo "APK:"
          echo "$APK"

          echo
          echo "APK size:"
          echo "$SIZE bytes"

          if [[ "$SIZE" -lt 100000 ]]; then
            echo "::error::APK is too small."
            exit 1
          fi

          echo
          echo "File type:"
          file "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

          echo
          echo "APK verification successful."

      # ============================================================
      # 15. PACKAGE PROJECT
      # ============================================================
      - name: Package built project
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cd .hope-project

          zip -qr \
            "$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0-built-project.zip" \
            . \
            -x ".dart_tool/*" \
            -x ".gradle/*" \
            -x "build/*" \
            -x "android/.gradle/*"

          cd "$GITHUB_WORKSPACE"

          echo
          echo "Built project package:"
          ls -lh artifacts/HOPE-3.8.0-built-project.zip

      # ============================================================
      # 16. DIAGNOSTICS
      # ============================================================
      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p artifacts/diagnostics

          echo "HOPE BUILD DIAGNOSTICS" \
            > artifacts/diagnostics/run-info.txt

          echo \
            >> artifacts/diagnostics/run-info.txt

          echo "Repository: $GITHUB_REPOSITORY" \
            >> artifacts/diagnostics/run-info.txt

          echo "Branch: $GITHUB_REF_NAME" \
            >> artifacts/diagnostics/run-info.txt

          echo "Commit: $GITHUB_SHA" \
            >> artifacts/diagnostics/run-info.txt

          echo "Flutter: $FLUTTER_VERSION" \
            >> artifacts/diagnostics/run-info.txt

          echo "Gradle: $GRADLE_VERSION" \
            >> artifacts/diagnostics/run-info.txt

          echo "Java: $JAVA_VERSION" \
            >> artifacts/diagnostics/run-info.txt

          flutter --version \
            > artifacts/diagnostics/flutter-version.txt \
            2>&1

          flutter doctor -v \
            > artifacts/diagnostics/flutter-doctor.txt \
            2>&1

          java -version \
            > artifacts/diagnostics/java-version.txt \
            2>&1

          df -h \
            > artifacts/diagnostics/disk.txt \
            2>&1

          free -h \
            > artifacts/diagnostics/memory.txt \
            2>&1

          ps aux \
            > artifacts/diagnostics/processes.txt \
            2>&1

          find "$GITHUB_WORKSPACE" \
            -maxdepth 4 \
            -type f \
            -print \
            | sort \
            > artifacts/diagnostics/workspace-files.txt

      # ============================================================
      # 17. UPLOAD APK
      # ============================================================
      - name: Upload HOPE APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-3.8.0-pilot-apk
          path: artifacts/HOPE-3.8.0-pilot.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 18. UPLOAD PROJECT
      # ============================================================
      - name: Upload built project
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-3.8.0-built-project
          path: artifacts/HOPE-3.8.0-built-project.zip
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 19. UPLOAD DIAGNOSTICS
      # ============================================================
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-build-diagnostics
          path: artifacts/diagnostics
          if-no-files-found: warn
          retention-days: 14
