name: HOPE ZIP Bootstrap

on:
  workflow_dispatch:
    inputs:
      archive:
        description: "ZIP filename in repository. Leave empty to auto-detect."
        required: false
        type: string

      build_profile:
        description: "Build profile"
        required: true
        type: choice
        default: pilot
        options:
          - pilot
          - production

permissions:
  contents: write

concurrency:
  group: hope-zip-bootstrap-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: HOPE ZIP Auto Build
    runs-on: ubuntu-24.04

    env:
      CI_ZIP_BUILD: "true"
      API_BASE_URL: ${{ secrets.API_BASE_URL != '' && secrets.API_BASE_URL || vars.API_BASE_URL }}

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Find ZIP
      # ============================================================
      - name: Find ZIP archive
        id: archive
        shell: bash
        env:
          INPUT_ARCHIVE: ${{ inputs.archive }}
        run: |
          set -euo pipefail

          ARCHIVE="${INPUT_ARCHIVE:-}"

          if [ -n "$ARCHIVE" ]; then
            if [ ! -f "$ARCHIVE" ]; then
              echo "ERROR: Requested ZIP does not exist:"
              echo "$ARCHIVE"
              exit 1
            fi
          else
            ARCHIVE="$(
              find . \
                -type f \
                -iname '*.zip' \
                ! -path './.git/*' \
                ! -path './.hope-work/*' \
                -print \
              | sort \
              | head -n 1
            )"

            if [ -z "$ARCHIVE" ]; then
              echo "ERROR: No ZIP archive found in repository."
              exit 1
            fi
          fi

          ARCHIVE="${ARCHIVE#./}"

          echo "Selected archive:"
          echo "$ARCHIVE"

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 3. Prepare workspace
      # ============================================================
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .hope-work
          mkdir -p .hope-work/source

      # ============================================================
      # 4. Extract ZIP
      # ============================================================
      - name: Extract source ZIP
        shell: bash
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          set -euo pipefail

          unzip -q "$ARCHIVE" -d ".hope-work/source"

          echo "ZIP extraction completed."

      # ============================================================
      # 5. Find Flutter project
      # ============================================================
      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE=".hope-work/source"
          PROJECT=""

          if [ -f "$SOURCE/pubspec.yaml" ]; then
            PROJECT="$SOURCE"
          else
            PUBSPEC="$(
              find "$SOURCE" \
                -type f \
                -name 'pubspec.yaml' \
                ! -path '*/.dart_tool/*' \
                ! -path '*/build/*' \
                -print \
              | sort \
              | head -n 1
            )"

            if [ -n "$PUBSPEC" ]; then
              PROJECT="$(dirname "$PUBSPEC")"
            fi
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Could not find pubspec.yaml."
            find "$SOURCE" -maxdepth 4 -type f | sort | head -300
            exit 1
          fi

          echo "Flutter project:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 6. Setup Flutter
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ============================================================
      # 7. Tool versions
      # ============================================================
      - name: Show tool versions
        shell: bash
        run: |
          set -euo pipefail

          flutter --version
          dart --version
          java -version

      # ============================================================
      # 8. Configure environment
      # ============================================================
      - name: Configure build environment
        shell: bash
        env:
          PROJECT: ${{ steps.project.outputs.project }}
          BUILD_PROFILE_INPUT: ${{ inputs.build_profile }}
        run: |
          set -euo pipefail

          if [ "$BUILD_PROFILE_INPUT" != "production" ] &&
             [ "$BUILD_PROFILE_INPUT" != "pilot" ]; then
            echo "ERROR: Invalid build profile."
            exit 1
          fi

          {
            echo "PROJECT_DIR=$PROJECT"
            echo "BUILD_PROFILE=$BUILD_PROFILE_INPUT"
            echo "CI_ZIP_BUILD=true"
          } >> "$GITHUB_ENV"

          echo "PROJECT_DIR=$PROJECT"
          echo "BUILD_PROFILE=$BUILD_PROFILE_INPUT"
          echo "CI_ZIP_BUILD=true"

      # ============================================================
      # 9. Validate API_BASE_URL
      # ============================================================
      - name: Validate API endpoint
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${API_BASE_URL:-}" ]; then
            echo "ERROR: API_BASE_URL is not configured."
            echo
            echo "Configure one of these in:"
            echo "Repository -> Settings -> Secrets and variables -> Actions"
            echo
            echo "Option A - Repository secret:"
            echo "API_BASE_URL"
            echo
            echo "Option B - Repository variable:"
            echo "API_BASE_URL"
            echo
            echo "Expected format:"
            echo "https://YOUR-API-HOST/api/v1"
            exit 1
          fi

          case "$API_BASE_URL" in
            https://*)
              ;;
            *)
              echo "ERROR: API_BASE_URL must use HTTPS."
              exit 1
              ;;
          esac

          if printf '%s' "$API_BASE_URL" | grep -Eq '[[:space:]]'; then
            echo "ERROR: API_BASE_URL contains whitespace."
            exit 1
          fi

          if ! printf '%s' "$API_BASE_URL" | grep -Eq '^https://[^[:space:]]+$'; then
            echo "ERROR: API_BASE_URL is malformed."
            exit 1
          fi

          echo "API_BASE_URL is configured and uses HTTPS."

      # ============================================================
      # 10. Flutter dependencies
      # ============================================================
      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter pub get

      # ============================================================
      # 11. Localization
      # ============================================================
      - name: Refresh generated localization
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "tools/generate_localization.sh" ]; then
            chmod +x tools/generate_localization.sh
            ./tools/generate_localization.sh
          elif [ -f "l10n.yaml" ]; then
            flutter gen-l10n
          else
            echo "Localization generator not present; continuing."
          fi

      # ============================================================
      # 12. Format
      # ============================================================
      - name: Format Dart source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          dart format lib test integration_test || true

      # ============================================================
      # 13. Analyze
      # ============================================================
      - name: Analyze Dart
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          flutter analyze

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "WARNING: Flutter analyzer reported issues."
            echo "Build will continue so compiler/build errors can be identified."
          fi

          exit 0

      # ============================================================
      # 14. Gradle compatibility
      # ============================================================
      - name: Configure Android Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="android"
          GRADLE_PROPERTIES="$ANDROID_DIR/gradle.properties"
          WRAPPER_PROPERTIES="$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"

          test -d "$ANDROID_DIR"
          test -f "$WRAPPER_PROPERTIES"

          touch "$GRADLE_PROPERTIES"

          # Keep the certified Gradle compatibility baseline.
          sed -i \
            -E 's#gradle-[0-9]+\.[0-9]+(\.[0-9]+)?-bin\.zip#gradle-8.14-bin.zip#' \
            "$WRAPPER_PROPERTIES"

          GRADLE_SHA256="61ad310d3c7d3e5da131b76bbf22b5a4c0786e9d892dae8c1658d4b484de3caa"

          if grep -q '^distributionSha256Sum=' "$WRAPPER_PROPERTIES"; then
            sed -i \
              "s/^distributionSha256Sum=.*/distributionSha256Sum=$GRADLE_SHA256/" \
              "$WRAPPER_PROPERTIES"
          else
            printf '%s\n' \
              "distributionSha256Sum=$GRADLE_SHA256" \
              >> "$WRAPPER_PROPERTIES"
          fi

          if grep -q '^android.newDsl=' "$GRADLE_PROPERTIES"; then
            sed -i \
              's/^android.newDsl=.*/android.newDsl=false/' \
              "$GRADLE_PROPERTIES"
          else
            printf '%s\n' \
              'android.newDsl=false' \
              >> "$GRADLE_PROPERTIES"
          fi

          if grep -q '^android.builtInKotlin=' "$GRADLE_PROPERTIES"; then
            sed -i \
              's/^android.builtInKotlin=.*/android.builtInKotlin=false/' \
              "$GRADLE_PROPERTIES"
          else
            printf '%s\n' \
              'android.builtInKotlin=false' \
              >> "$GRADLE_PROPERTIES"
          fi

          echo "===== gradle-wrapper.properties ====="
          cat "$WRAPPER_PROPERTIES"

          echo
          echo "===== gradle.properties ====="
          cat "$GRADLE_PROPERTIES"

      # ============================================================
      # 15. Verify Gradle
      # ============================================================
      - name: Verify Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x android/gradlew
          ./android/gradlew --version

      # ============================================================
      # 16. Production signing
      # ============================================================
      - name: Configure production signing
        if: env.BUILD_PROFILE == 'production'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "ERROR: Missing GitHub repository secret:"
            echo "ANDROID_RELEASE_KEYSTORE_B64"
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/hope-release.jks"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: Decoded release keystore is empty."
            exit 1
          fi

          echo "ANDROID_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Production keystore prepared."

      # ============================================================
      # 17. Verify production secrets
      # ============================================================
      - name: Verify production signing secrets
        if: env.BUILD_PROFILE == 'production'
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${STORE_PASSWORD:-}" ]; then
            echo "ERROR: Missing ANDROID_RELEASE_STORE_PASSWORD"
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: Missing ANDROID_RELEASE_KEY_ALIAS"
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: Missing ANDROID_RELEASE_KEY_PASSWORD"
            exit 1
          fi

          test -n "${ANDROID_RELEASE_STORE_FILE:-}"
          test -f "$ANDROID_RELEASE_STORE_FILE"

          echo "Production signing configuration is present."

      # ============================================================
      # 18. Build APK
      # ============================================================
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          API_BASE_URL: ${{ env.API_BASE_URL }}
          BUILD_PROFILE: ${{ env.BUILD_PROFILE }}

          ANDROID_RELEASE_STORE_FILE: ${{ env.ANDROID_RELEASE_STORE_FILE }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "HOPE Android Release Build"
          echo "BUILD_PROFILE=$BUILD_PROFILE"
          echo "API_BASE_URL configured: yes"
          echo "========================================"

          flutter clean
          flutter pub get

          if [ -f "tools/build_apk_release.sh" ]; then
            chmod +x tools/build_apk_release.sh
            ./tools/build_apk_release.sh
          else
            flutter build apk \
              --release \
              --dart-define=API_BASE_URL="$API_BASE_URL"
          fi

      # ============================================================
      # 19. Locate APK
      # ============================================================
      - name: Locate APK
        id: apk
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK=""

          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            APK="build/app/outputs/flutter-apk/app-release.apk"
          else
            APK="$(
              find build/app/outputs \
                -type f \
                -name '*.apk' \
                -print \
              | sort \
              | head -n 1
            )"
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find build/app/outputs \
              -maxdepth 8 \
              -type f \
              -print 2>/dev/null || true
            exit 1
          fi

          test -s "$APK"

          echo "APK=$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 20. SHA256
      # ============================================================
      - name: Generate APK checksum
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          APK: ${{ steps.apk.outputs.apk }}
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$APK" > "$APK.sha256"

          cat "$APK.sha256"

      # ============================================================
      # 21. APK verification
      # ============================================================
      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          APK: ${{ steps.apk.outputs.apk }}
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER=""

          if command -v apksigner >/dev/null 2>&1; then
            APKSIGNER="$(command -v apksigner)"
          elif [ -n "${ANDROID_HOME:-}" ] &&
               [ -f "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)/apksigner" ]; then
            APKSIGNER="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)/apksigner"
          fi

          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK"
          else
            echo "WARNING: apksigner unavailable."
            echo "Flutter generated the APK successfully."
          fi

      # ============================================================
      # 22. Upload artifact
      # ============================================================
      - name: Upload HOPE APK
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-${{ env.BUILD_PROFILE }}-${{ github.run_number }}
          path: |
            ${{ env.PROJECT_DIR }}/${{ steps.apk.outputs.apk }}
           
