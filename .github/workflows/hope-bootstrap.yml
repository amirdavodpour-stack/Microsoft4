name: HOPE ZIP Bootstrap

on:
  workflow_dispatch:
    inputs:
      archive:
        description: "ZIP filename in repository (leave blank to auto-detect)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hope-zip-bootstrap-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_ZIP: HOPE-3_8_0-GITHUB-ZIP-AUTO-BUILD-READY-V5-SELF-HEALING.zip
  FLUTTER_VERSION: "3.47.0"
  JAVA_VERSION: "17"
  BUILD_PROFILE: "pilot"

jobs:
  build:
    name: HOPE APK Self-Healing Build
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ============================================================
      # 2. FIND ZIP
      # ============================================================

      - name: Locate source ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="${{ inputs.archive }}"

          if [[ -n "$ARCHIVE" ]]; then

            if [[ ! -f "$ARCHIVE" ]]; then
              echo "Requested archive not found: $ARCHIVE"
              exit 1
            fi

            SOURCE="$ARCHIVE"

          elif [[ -f "$SOURCE_ZIP" ]]; then

            SOURCE="$SOURCE_ZIP"

          else

            SOURCE="$(
              find . \
                -maxdepth 3 \
                -type f \
                \( \
                  -name 'HOPE-*.zip' \
                  -o \
                  -name '*.zip' \
                \) \
                | sort \
                | head -n 1
            )"

          fi

          if [[ -z "${SOURCE:-}" ]]; then
            echo "No ZIP archive found."
            exit 1
          fi

          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

          echo
          echo "========================================"
          echo "SOURCE ZIP"
          echo "========================================"
          echo "$SOURCE"

      # ============================================================
      # 3. VERIFY ZIP
      # ============================================================

      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "${{ steps.locate_zip.outputs.source }}"

      # ============================================================
      # 4. JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 5. FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ============================================================
      # 6. TOOLCHAIN
      # ============================================================

      - name: Show toolchain
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "FLUTTER"
          echo "========================================"

          flutter --version

          echo
          echo "========================================"
          echo "DART"
          echo "========================================"

          dart --version

          echo
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo
          echo "========================================"
          echo "FLUTTER DOCTOR"
          echo "========================================"

          flutter doctor -v || true

      # ============================================================
      # 7. EXTRACT PROJECT
      # ============================================================

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .hope-project

          mkdir -p .hope-project

          unzip -q \
            "${{ steps.locate_zip.outputs.source }}" \
            -d .hope-project

          if [[ -f ".hope-project/pubspec.yaml" ]]; then

            PROJECT_ROOT=".hope-project"

          else

            PROJECT_ROOT="$(
              find .hope-project \
                -maxdepth 4 \
                -name pubspec.yaml \
                -print \
                -quit \
                | xargs -r dirname
            )"

          fi

          if [[ \
            -z "${PROJECT_ROOT:-}" \
            || \
            ! -f "$PROJECT_ROOT/pubspec.yaml" \
          ]]; then

            echo "Flutter project not found after extraction."

            find .hope-project \
              -maxdepth 4 \
              -type f \
              | head -200

            exit 1

          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "PROJECT ROOT"
          echo "========================================"

          echo "$PROJECT_ROOT"

      # ============================================================
      # 8. VALIDATE PROJECT
      # ============================================================

      - name: Validate Flutter project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          test -f pubspec.yaml
          test -d android
          test -f android/gradlew

          chmod +x android/gradlew

          echo
          echo "Flutter project detected."

          echo
          echo "========================================"
          echo "INITIAL PUB GET"
          echo "========================================"

          flutter pub get

          echo
          echo "========================================"
          echo "GENERATE LOCALIZATION"
          echo "========================================"

          flutter gen-l10n || true

          echo
          echo "========================================"
          echo "PUBSPEC"
          echo "========================================"

          grep -n -A4 -B4 "integration_test" pubspec.yaml || true

          echo
          echo "========================================"
          echo "GENERATED PLUGIN REGISTRANT"
          echo "========================================"

          find android/app/src \
            -type f \
            \( \
              -name 'GeneratedPluginRegistrant.java' \
              -o \
              -name 'GeneratedPluginRegistrant.kt' \
            \) \
            -print || true

      # ============================================================
      # 9. API CONFIG
      # ============================================================

      - name: Validate API configuration
        shell: bash
        env:
          INPUT_API_BASE_URL: ${{ vars.API_BASE_URL }}
          SECRET_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail

          API_BASE_URL_VALUE="${SECRET_API_BASE_URL:-${INPUT_API_BASE_URL:-}}"

          if [[ -z "$API_BASE_URL_VALUE" ]]; then

            echo "API_BASE_URL is not configured."

            echo "Create a GitHub Actions Variable or Secret named:"
            echo "API_BASE_URL"

            exit 1

          fi

          if [[ ! "$API_BASE_URL_VALUE" =~ ^https:// ]]; then

            echo "API_BASE_URL must start with https://"

            exit 1

          fi

          echo "API_BASE_URL configured successfully."

      # ============================================================
      # 10. STOP GRADLE
      # ============================================================

      - name: Stop Gradle daemons
        shell: bash
        run: |
          set +e

          cd "$PROJECT_ROOT"

          chmod +x android/gradlew

          ./android/gradlew --stop || true

      # ============================================================
      # 11. BASE PREFLIGHT
      # ============================================================

      - name: Preflight cleanup
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          rm -rf \
            build \
            .dart_tool \
            .gradle \
            android/.gradle \
            android/build \
            android/app/build

          flutter clean

          flutter pub get

          flutter gen-l10n || true

          echo
          echo "========================================"
          echo "BASE PREFLIGHT COMPLETE"
          echo "========================================"

      # ============================================================
      # 12. BUILD
      # ============================================================

      - name: Build APK with release dependency isolation
        shell: bash
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || vars.API_BASE_URL }}
        run: |
          set -euo pipefail

          BASE_PROJECT="$PROJECT_ROOT"

          BUILD_SUCCEEDED=0

          for ATTEMPT in 1 2; do

            echo
            echo "============================================================"
            echo "RELEASE BUILD ATTEMPT $ATTEMPT / 2"
            echo "============================================================"

            ATTEMPT_DIR="$GITHUB_WORKSPACE/.hope-attempt-$ATTEMPT"

            GRADLE_HOME="$GITHUB_WORKSPACE/.gradle-attempt-$ATTEMPT"

            rm -rf "$ATTEMPT_DIR"
            rm -rf "$GRADLE_HOME"

            cp -a \
              "$BASE_PROJECT" \
              "$ATTEMPT_DIR"

            mkdir -p "$GRADLE_HOME"

            chmod +x \
              "$ATTEMPT_DIR/android/gradlew"

            export GRADLE_USER_HOME="$GRADLE_HOME"

            export GRADLE_OPTS="\
            -Dorg.gradle.daemon=false \
            -Dorg.gradle.vfs.watch=false \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.caching=false \
            -Dorg.gradle.configuration-cache=false"

            cd "$ATTEMPT_DIR"

            # --------------------------------------------------------
            # A. CLEAN
            # --------------------------------------------------------

            echo
            echo "----------------------------------------"
            echo "A. CLEAN"
            echo "----------------------------------------"

            ./android/gradlew --stop || true

            rm -rf \
              build \
              .dart_tool \
              .gradle \
              android/.gradle \
              android/build \
              android/app/build

            flutter clean

            # --------------------------------------------------------
            # B. RESTORE ALL NORMAL DEPENDENCIES
            # --------------------------------------------------------

            echo
            echo "----------------------------------------"
            echo "B. PUB GET"
            echo "----------------------------------------"

            flutter pub get

            # --------------------------------------------------------
            # C. RELEASE-ONLY DEPENDENCY ISOLATION
            # --------------------------------------------------------
            #
            # integration_test MUST remain in the source project because
            # it is used for integration tests.
            #
            # We only remove it from the temporary RELEASE COPY.
            #
            # This prevents Flutter from generating:
            #
            # IntegrationTestPlugin()
            #
            # inside the release GeneratedPluginRegistrant.java.
            #
            # The original project and integration_test directory remain
            # untouched.
            # --------------------------------------------------------

            echo
            echo "----------------------------------------"
            echo "C. RELEASE DEPENDENCY ISOLATION"
            echo "----------------------------------------"

            python3 <<'PY'
          from pathlib import Path

          pubspec = Path("pubspec.yaml")

          text = pubspec.read_text(encoding="utf-8")

          lines = text.splitlines()

          out = []

          removed = False
          in_dev_dependencies = False
          skip_sdk_line = False

          for line in lines:

              stripped = line.strip()

              if line.startswith("dev_dependencies:"):
                  in_dev_dependencies = True
                  out.append(line)
                  continue

              if in_dev_dependencies:

                  if (
                      line
                      and not line.startswith(" ")
                      and not line.startswith("\t")
                  ):
                      in_dev_dependencies = False

                  if in_dev_dependencies and stripped == "integration_test:":
                      removed = True
                      skip_sdk_line = True
                      continue

                  if (
                      in_dev_dependencies
                      and skip_sdk_line
                      and stripped == "sdk: flutter"
                  ):
                      skip_sdk_line = False
                      continue

                  if in_dev_dependencies and skip_sdk_line:
                      skip_sdk_line = False

              out.append(line)

          if not removed:
              raise SystemExit(
                  "integration_test dependency was not found "
                  "inside dev_dependencies"
              )

          pubspec.write_text(
              "\n".join(out) + "\n",
              encoding="utf-8",
          )

          print(
              "integration_test removed from temporary release pubspec."
          )
          PY

            echo
            echo "Temporary release pubspec:"
            grep -n -A4 -B4 \
              "dev_dependencies" \
              pubspec.yaml \
              | head -30 || true

            if grep -q \
              -E '^[[:space:]]{2}integration_test:' \
              pubspec.yaml; then

              echo
              echo "ERROR: integration_test is still present."
              exit 1

            fi

            # --------------------------------------------------------
            # D. RE-RESOLVE DEPENDENCIES
            # --------------------------------------------------------

            echo
            echo "----------------------------------------"
            echo "D. RELEASE PUB GET"
            echo "----------------------------------------"

            flutter pub get

            # --------------------------------------------------------
            # E. REGENERATE LOCALIZATION
            # --------------------------------------------------------

            echo
            echo "----------------------------------------"
            echo "E. GEN L10N"
            echo "----------------------------------------"

            flutter gen-l10n || true

            # --------------------------------------------------------
            # F. VERIFY REGISTRANT
            # --------------------------------------------------------

            echo
            echo "----------------------------------------"
            echo "F. VERIFY PLUGIN REGISTRANT"
            echo "----------------------------------------"

            REGISTRANT="android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java"

            if [[ -f "$REGISTRANT" ]]; then

              echo "GeneratedPluginRegistrant.java found."

              if grep -n \
                -E \
                "integration_test|IntegrationTestPlugin" \
                "$REGISTRANT"; then

                echo
                echo "ERROR: integration_test is STILL registered."
                echo
                echo "Registrant content:"
                sed -n '1,140p' "$REGISTRANT"

                exit 1

              else

                echo
                echo "SUCCESS:"
                echo "integration_test is NOT registered in release."

              fi

            else

              echo "GeneratedPluginRegistrant.java not found."

            fi

            # --------------------------------------------------------
            # G. BUILD APK
            # --------------------------------------------------------

            echo
            echo "----------------------------------------"
            echo "G. BUILD APK"
            echo "----------------------------------------"

            set +e

            flutter build apk \
              --release \
              --dart-define="API_BASE_URL=$API_BASE_URL" \
              --dart-define="BUILD_PROFILE=$BUILD_PROFILE" \
              --no-pub \
              --android-skip-build-dependency-validation

            BUILD_EXIT=$?

            set -e

            echo
            echo "Flutter build exit code: $BUILD_EXIT"

            # --------------------------------------------------------
            # H. VERIFY APK
            # --------------------------------------------------------

            if [[ "$BUILD_EXIT" -eq 0 ]]; then

              APK_PATH="$(
                find \
                  build/app/outputs/apk \
                  -type f \
                  -name '*.apk' \
                  -print \
                  | head -n 1
              )"

              if [[ \
                -n "${APK_PATH:-}" \
                && \
                -f "$APK_PATH"
              ]]; then

                APK_SIZE="$(
                  stat -c%s "$APK_PATH"
                )"

                echo
                echo "APK FOUND:"
                echo "$APK_PATH"

                echo
                echo "APK SIZE:"
                echo "$APK_SIZE bytes"

                if [[ "$APK_SIZE" -gt 1000000 ]]; then

                  mkdir -p \
                    "$GITHUB_WORKSPACE/artifacts"

                  cp \
                    "$APK_PATH" \
                    "$GITHUB_WORKSPACE/artifacts/HOPE-3.8.0+11-pilot.apk"

                  BUILD_SUCCEEDED=1

                  echo
                  echo "============================================================"
                  echo "APK BUILD SUCCESSFUL"
                  echo "============================================================"

                  break

                fi

              fi

            fi

            # --------------------------------------------------------
            # I. DIAGNOSTICS
            # --------------------------------------------------------

            echo
            echo "============================================================"
            echo "ATTEMPT $ATTEMPT FAILED"
            echo "============================================================"

            echo
            echo "Current GeneratedPluginRegistrant.java:"

            if [[ -f "$REGISTRANT" ]]; then

              sed -n '1,180p' \
                "$REGISTRANT"

            fi

            echo
            echo "Integration-test references:"

            if [[ -f "$REGISTRANT" ]]; then

              grep -n \
                -E \
                "integration_test|IntegrationTestPlugin" \
                "$REGISTRANT" \
                || true

            fi

            cd "$GITHUB_WORKSPACE"

          done

          # ==========================================================
          # FINAL RESULT
          # ==========================================================

          if [[ "$BUILD_SUCCEEDED" -ne 1 ]]; then

            echo
            echo "============================================================"
            echo "ALL RELEASE BUILD ATTEMPTS FAILED"
            echo "============================================================"

            exit 1

          fi

      # ============================================================
      # 13. FINAL APK VERIFICATION
      # ============================================================

      - name: Verify final APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="artifacts/HOPE-3.8.0+11-pilot.apk"

          test -f "$APK"

          SIZE="$(
            stat -c%s "$APK"
          )"

          echo
          echo "========================================"
          echo "FINAL APK"
          echo "========================================"

          echo "$APK"

          echo
          echo "========================================"
          echo "SIZE"
          echo "========================================"

          echo "$SIZE bytes"

          if [[ "$SIZE" -le 1000000 ]]; then

            echo
            echo "APK is suspiciously small."

            exit 1

          fi

      # ============================================================
      # 14. DIAGNOSTICS
      # ============================================================

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p diagnostics

          echo "=== Repository ===" \
            > diagnostics/diagnostics.txt

          git rev-parse HEAD \
            >> diagnostics/diagnostics.txt \
            2>&1

          echo "" \
            >> diagnostics/diagnostics.txt

          echo "=== Flutter ===" \
            >> diagnostics/diagnostics.txt

          flutter --version \
            >> diagnostics/diagnostics.txt \
            2>&1

          echo "" \
            >> diagnostics/diagnostics.txt

          echo "=== Project ===" \
            >> diagnostics/diagnostics.txt

          echo "PROJECT_ROOT=$PROJECT_ROOT" \
            >> diagnostics/diagnostics.txt

          echo "" \
            >> diagnostics/diagnostics.txt

          echo "=== Original Pubspec integration_test ===" \
            >> diagnostics/diagnostics.txt

          if [[ -f "$PROJECT_ROOT/pubspec.yaml" ]]; then

            grep -n \
              -A4 \
              -B4 \
              "integration_test" \
              "$PROJECT_ROOT/pubspec.yaml" \
              >> diagnostics/diagnostics.txt \
              2>&1 \
              || true

          fi

          echo "" \
            >> diagnostics/diagnostics.txt

          echo "=== Attempt Files ===" \
            >> diagnostics/diagnostics.txt

          for ATTEMPT in 1 2; do

            if [[ -d ".hope-attempt-$ATTEMPT" ]]; then

              echo \
                "Attempt $ATTEMPT" \
                >> diagnostics/diagnostics.txt

              find \
                ".hope-attempt-$ATTEMPT" \
                -type f \
                \( \
                  -name \
                    'GeneratedPluginRegistrant.java' \
                  -o \
                  -name '*.log' \
                \) \
                | sort \
                | head -100 \
                >> diagnostics/diagnostics.txt \
                2>&1

            fi

          done

      # ============================================================
      # 15. UPLOAD APK
      # ============================================================

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-3.8.0+11-pilot-apk
          path: artifacts/HOPE-3.8.0+11-pilot.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 16. UPLOAD DIAGNOSTICS
      # ============================================================

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-bootstrap-diagnostics
          path: diagnostics
          if-no-files-found: ignore
          retention-days: 7
